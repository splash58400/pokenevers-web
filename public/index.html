// Petit effet de particules réutilisable (retour visuel "vivant" sur un point d'intérêt actionné ou
// un coffre qui s'ouvre) : une volée de pastilles colorées jaillit du point (x,y) donné en coordonnées
// écran, puis s'efface toute seule — indépendant de la mise en page en dessous (position fixed), donc
// utilisable aussi bien au-dessus de la carte que d'un écran de l'Inventaire qui vient de se re-rendre.
function spawnParticles(x, y, colors, opts){
  opts = opts || {};
  const count = opts.count!=null ? opts.count : 14;
  const spread = opts.spread!=null ? opts.spread : 70;
  // Mode "confetti" (Version 23, demandé par Jérémy pour un tap sur un point d'intérêt et une
  // capture réussie) : des petits rectangles qui tournent en tombant, plutôt que de simples ronds —
  // un rendu plus festif pour ces deux moments de récompense.
  const confetti = !!opts.confetti;
  let layer = document.getElementById('particleLayer');
  if(!layer){
    layer = document.createElement('div');
    layer.id = 'particleLayer';
    document.body.appendChild(layer);
  }
  for(let i=0;i<count;i++){
    const p = document.createElement('div');
    const angle = Math.random()*Math.PI*2;
    const dist = spread*(0.5+Math.random()*0.5);
    const dx = Math.cos(angle)*dist, dy = Math.sin(angle)*dist;
    const color = colors[Math.floor(Math.random()*colors.length)];
    p.style.left = x+'px'; p.style.top = y+'px';
    p.style.setProperty('--dx', dx+'px');
    p.style.setProperty('--dy', dy+'px');
    if(confetti){
      p.className = 'burst-confetti';
      const w = 5+Math.random()*4, h = 8+Math.random()*6;
      p.style.width = w+'px'; p.style.height = h+'px';
      p.style.background = color;
      const rot = (Math.random()<0.5?-1:1)*(320+Math.random()*400);
      p.style.setProperty('--rot', rot+'deg');
    } else {
      p.className = 'burst-particle';
      const size = 5+Math.random()*5;
      p.style.width = size+'px'; p.style.height = size+'px';
      p.style.background = color;
    }
    layer.appendChild(p);
    p.addEventListener('animationend', ()=> p.remove(), {once:true});
    setTimeout(()=>{ if(p.parentNode) p.remove(); }, 1300); // filet de sécurité si l'évènement ne se déclenche pas
  }
  // Anneau qui s'étend et s'efface (petite "onde de choc") — réservé aux moments plus marquants
  // (ouverture d'un coffre) pour bien les distinguer d'un simple tirage à un point d'intérêt.
  if(opts.ring){
    const ring = document.createElement('div');
    ring.className = 'burst-ring';
    const ringSize = opts.ringSize || 60;
    ring.style.left = x+'px'; ring.style.top = y+'px';
    ring.style.width = ringSize+'px'; ring.style.height = ringSize+'px';
    ring.style.borderColor = colors[0];
    layer.appendChild(ring);
    ring.addEventListener('animationend', ()=> ring.remove(), {once:true});
    setTimeout(()=>{ if(ring.parentNode) ring.remove(); }, 800);
  }
}
// Position écran (coin haut-gauche + centre) d'un élément DOM, pratique pour faire jaillir des
// particules au bon endroit qu'il s'agisse d'un marqueur sur la carte ou d'une carte dans un écran.
function elementCenter(el){
  const r = el.getBoundingClientRect();
  return { x: r.left + r.width/2, y: r.top + r.height/2 };
}
function spinPoi(p,i){
  const key = 'p'+i;
  const last = state.poiSpins[key]||0;
  const cooldownMs = 5*60*1000;
  if(Date.now()-last < cooldownMs){
    showToast(`${p.name} : revenez dans ${Math.ceil((cooldownMs-(Date.now()-last))/60000)} min.`);
    return;
  }
  state.poiSpins[key]=Date.now();
  state.totalPoiSpins = (state.totalPoiSpins||0)+1;
  // Gerbe de confettis au point exact du marqueur, en plus de la rotation de l'icône (déjà
  // déclenchée par spinPoiIcon) — seulement quand la récompense est vraiment accordée, pas sur
  // un tap bloqué par le temps de recharge. Passée en mode confettis et bien plus fournie en
  // Version 23 (demande de Jérémy, l'ancienne gerbe dorée étant jugée trop discrète) ; couleurs
  // reprenant les trois récompenses distribuées par un point d'intérêt (or = pièces, blanc = exp,
  // vert = Nœud Vert).
  const poiMarkerEl = poiMarkers[i] && poiMarkers[i].getElement ? poiMarkers[i].getElement() : null;
  if(poiMarkerEl){
    const c = elementCenter(poiMarkerEl);
    spawnParticles(c.x, c.y, ['#eab545','#ffd873','#a97a1f','#fff3d6','#2f9e52','#4fc3f7'], {count:34, spread:95, confetti:true});
  }
  const cMin = p.rewardCoinsMin!=null?p.rewardCoinsMin:2, cMax = p.rewardCoinsMax!=null?p.rewardCoinsMax:4;
  const mult = eventBonusMultiplier();
  const gained = Math.round((cMin+Math.floor(Math.random()*(cMax-cMin+1)))*mult);
  const xpGain = Math.round((p.rewardXp!=null?p.rewardXp:15)*mult);
  const nMin = p.rewardNoeudsMin!=null?p.rewardNoeudsMin:1, nMax = p.rewardNoeudsMax!=null?p.rewardNoeudsMax:3;
  const noeudsGained = Math.round((nMin+Math.floor(Math.random()*(nMax-nMin+1)))*mult);
  state.coins += gained;
  state.xp += xpGain;
  state.noeudsVerts += noeudsGained;
  const findMsgs = rollChestDrop();
  saveLocal();
  renderStatusBar();
  if(activeView==='inventory') renderInventory();
  let msg = `${p.name} : +${gained} pièces, +${noeudsGained} Nœud Vert, +${xpGain} exp !`;
  if(findMsgs.length) msg += ' ' + findMsgs.join(' ');
  showToast(msg);
  checkMissions();
}
// Trouvailles rares à un point d'intérêt : une clé et un coffre sont tirés indépendamment
// (voir ACTIVE_CHEST_FIND_CHANCE), chacun avec une couleur pondérée par ACTIVE_CHEST_DROP_WEIGHTS.
function rollChestDrop(){
  const msgs = [];
  if(Math.random() < ACTIVE_CHEST_FIND_CHANCE.key){
    const color = pickChestColor();
    state.keys[color] = (state.keys[color]||0) + 1;
    msgs.push(`🔑 Clé ${CHEST_COLOR_LABEL[color]} trouvée !`);
  }
  if(Math.random() < ACTIVE_CHEST_FIND_CHANCE.chest){
    const color = pickChestColor();
    state.chests.push({ id: 'chest_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7), color, foundAt: Date.now() });
    msgs.push(`🧰 Coffre ${CHEST_COLOR_LABEL[color]} trouvé !`);
  }
  return msgs;
}

/* ============================= BALLONS ============================= */
// Apparition/disparition et rendu des ballons rouges — voir DEFAULT_BALLOON_CONFIG plus haut
// pour le détail des réglages (repris de gamedata.balloonConfig s'il est configuré).
function renderBalloonMarkers(){
  Object.values(balloonMarkers).forEach(m=> map.removeLayer(m));
  balloonMarkers = {};
  (state.balloons||[]).forEach(b=>{
    const el = L.marker([b.lat,b.lon], {
      icon: divIcon(`<div class="smarker balloon"><div class="badge">${icon('balloon')}</div><div class="stem" style="background:#c0392b;"></div></div>`, [50,66], [25,66])
    }).addTo(map);
    el.on('click', ()=> onBalloonTap(b));
    balloonMarkers[b.uid]=el;
  });
}
// Retire les ballons expirés (non éclatés à temps) sans notification — silencieux, comme prévu.
function pruneExpiredBalloons(){
  const now = Date.now();
  const before = (state.balloons||[]).length;
  state.balloons = (state.balloons||[]).filter(b=> b.expiresAt > now);
  return state.balloons.length !== before;
}
// Tente de faire apparaître un nouveau ballon si la place et le délai le permettent. Appelée
// régulièrement (voir boot()) et à chaque nouvelle position GPS — sans effet la plupart du temps.
function maybeSpawnBalloon(){
  if(!state) return;
  const changed = pruneExpiredBalloons();
  const cfg = ACTIVE_BALLOON_CONFIG;
  let spawned = false;
  if(curLat!=null && state.balloons.length < cfg.maxActive && Date.now() >= state.nextBalloonSpawnAt){
    const angle = Math.random()*Math.PI*2;
    const dist = cfg.spawnRadiusMin + Math.random()*Math.max(0, cfg.spawnRadiusMax-cfg.spawnRadiusMin);
    const pt = destPoint(curLat, curLon, Math.cos(angle)*dist, Math.sin(angle)*dist);
    const now = Date.now();
    state.balloons.push({ uid:'balloon_'+now.toString(36)+Math.random().toString(36).slice(2,7), lat:pt.lat, lon:pt.lon, expiresAt: now + cfg.lifetimeMinutes*60000 });
    const intervalMin = cfg.spawnIntervalMinMin + Math.random()*Math.max(0, cfg.spawnIntervalMaxMin-cfg.spawnIntervalMinMin);
    state.nextBalloonSpawnAt = now + intervalMin*60000;
    spawned = true;
  }
  if(changed || spawned){ saveLocal(); if(map) renderBalloonMarkers(); }
}
function onBalloonTap(b){
  if(curLat===null){ showToast('En attente de votre position GPS...'); return; }
  const dist = map.distance([curLat,curLon],[b.lat,b.lon]);
  if(dist>RANGE_M){ showToast(`Trop loin (${fmtDist(dist)}) — rapprochez-vous à moins de ${RANGE_M} m.`); return; }
  const idx = state.balloons.findIndex(x=>x.uid===b.uid);
  if(idx<0) return; // déjà éclaté ou expiré entre-temps (ex. double-clic)
  state.balloons.splice(idx,1);
  const cfg = ACTIVE_BALLOON_CONFIG;
  const mult = eventBonusMultiplier();
  const gained = Math.round((cfg.rewardCoinsMin+Math.floor(Math.random()*(cfg.rewardCoinsMax-cfg.rewardCoinsMin+1)))*mult);
  const xpGain = Math.round(cfg.rewardXp*mult);
  const noeudsGained = Math.round((cfg.rewardNoeudsMin+Math.floor(Math.random()*(cfg.rewardNoeudsMax-cfg.rewardNoeudsMin+1)))*mult);
  state.coins += gained;
  state.xp += xpGain;
  state.noeudsVerts += noeudsGained;
  saveLocal();
  renderStatusBar();
  if(activeView==='inventory') renderInventory();
  const marker = balloonMarkers[b.uid];
  const el = marker && marker.getElement ? marker.getElement() : null;
  const badge = el ? el.querySelector('.badge') : null;
  if(badge){
    badge.classList.add('pop');
    setTimeout(()=> renderBalloonMarkers(), 300);
  } else {
    renderBalloonMarkers();
  }
  showToast(`🎈 Ballon éclaté : +${gained} pièces, +${noeudsGained} Nœud Vert, +${xpGain} exp !`);
  checkMissions();
}

/* ============================= GEO ============================= */
const GEO_MESSAGES = {
  unsupported: "La géolocalisation n'est pas prise en charge par ce navigateur — position simulée au centre de Nevers.",
  denied: "Localisation refusée. Autorisez la position pour ce site dans les réglages de votre navigateur, puis appuyez sur Réessayer.",
  timeout: "Le GPS met trop de temps à répondre (courant en intérieur). Sortez si possible et appuyez sur Réessayer.",
  unavailable: "Position momentanément indisponible. Appuyez sur Réessayer.",
};
function startGeo(){
  hideGeoBanner();
  if(!('geolocation' in navigator)){ fallbackGeo('unsupported'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ usingFallback=false; onGeo(pos.coords.latitude,pos.coords.longitude); hideGeoBanner(); startWatch(); },
    err=>{ const code=err&&err.code; fallbackGeo(code===1?'denied':(code===3?'timeout':'unavailable')); },
    {enableHighAccuracy:true, timeout:10000}
  );
}
function startWatch(){
  if(geoWatchId!==null) return;
  geoWatchId = navigator.geolocation.watchPosition(
    pos=>{ usingFallback=false; onGeo(pos.coords.latitude,pos.coords.longitude); hideGeoBanner(); },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:2000, timeout:12000}
  );
}
function fallbackGeo(reason){
  usingFallback=true;
  if(curLat===null) onGeo(ORIGIN.lat, ORIGIN.lon);
  showGeoBanner(GEO_MESSAGES[reason] || GEO_MESSAGES.unavailable);
}
function showGeoBanner(msg){
  const b=document.getElementById('geoBanner'); if(!b) return;
  b.querySelector('.geo-banner-text').textContent=msg; b.style.display='flex';
}
function hideGeoBanner(){ const b=document.getElementById('geoBanner'); if(b) b.style.display='none'; }
function onGeo(lat,lon){
  curLat=lat; curLon=lon;
  if(!firstFixDone){
    firstFixDone=true;
    if(!usingFallback) setTimeout(()=> showToast('GPS réel activé · vraie carte OpenStreetMap.'), 400);
  }
  if(playerLeafletMarker) playerLeafletMarker.setLatLng([lat,lon]);
  if(rangeCircle) rangeCircle.setLatLng([lat,lon]);
  if(followMode && map) map.panTo([lat,lon], {animate:true, duration:0.4});
  maybeSpawnBalloon();
}

/* ============================= CAPTURE ============================= */
let capture=null;
function openCapture(sp){
  const species = getSpeciesById(sp.speciesId);
  const stageIdx = (state.captures[sp.speciesId]?.stage)||0;
  const stage = species.stages[Math.min(stageIdx, species.stages.length-1)];
  const zoneW = RARITY_ZONE[species.rarity];
  const shinyOn = isShinyActive(species.shiny);
  const roundsTotal = RARITY_ROUNDS[species.rarity];
  capture = { spawnUid:sp.uid, species, stage, running:true, pos:0, dir:1, speed:0.028, resolved:false,
    roundsTotal, roundsWon:0,
    zoneStart: Math.max(0.06, Math.min(1-zoneW-0.06, Math.random()*(1-zoneW))) };
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div id="captureView">
      <div class="capture-top"><button class="capture-close" id="captureCloseBtn">${icon('close','style="width:16px;height:16px;stroke:var(--ink-soft)"')}</button><div></div></div>
      <div class="capture-stage" style="--rarity:${shinyOn?(species.shiny.color||'#d9a441'):`var(--rarity-${species.rarity})`};">
        <span class="rarity-tag ${species.rarity}">${RARITY_LABEL[species.rarity]}</span>
        ${shinyOn?`<span class="tag-shiny">✨ ${escapeHtml(species.shiny.label||'Shiny')}</span>`:''}
        <div class="capture-portrait ${shinyOn?'shiny':''}" id="capturePortrait" style="--rarity:${shinyOn?(species.shiny.color||'#d9a441'):`var(--rarity-${species.rarity})`};">${icon(species.icon)}</div>
        <h2 class="capture-name">${escapeHtml(species.name||stage.name)}</h2>
        ${(species.name && species.name!==stage.name)?`<p class="capture-stage-name">${escapeHtml(stage.name)}</p>`:''}
        ${roundsTotal>1?`<p class="capture-round-label" id="captureRoundLabel"></p><div class="capture-rounds" id="captureRounds"></div>`:''}
        <p class="capture-hint">Appuyez sur la carte quand l'aiguille est dans la zone verte.</p>
        <div class="capture-track" id="captureTrack">
          <div class="zone" id="captureZone" style="left:${capture.zoneStart*100}%; width:${zoneW*100}%;"></div>
          <div class="needle" id="captureNeedle"></div>
        </div>
        <button class="card-throw" id="throwBtn">${icon('compass')}</button>
        <div id="captureResultWrap"></div>
      </div>
    </div>`;
  document.getElementById('captureCloseBtn').onclick = closeCapture;
  document.getElementById('throwBtn').onclick = doThrow;
  updateCaptureRounds();
  requestAnimationFrame(captureLoop);
}
function updateCaptureRounds(){
  if(!capture || capture.roundsTotal<=1) return;
  const label = document.getElementById('captureRoundLabel');
  const pips = document.getElementById('captureRounds');
  if(label) label.textContent = `Manche ${Math.min(capture.roundsWon+1, capture.roundsTotal)}/${capture.roundsTotal}`;
  if(pips) pips.innerHTML = Array.from({length:capture.roundsTotal}).map((_,i)=>
    `<i class="${i<capture.roundsWon?'won':''} ${i===capture.roundsWon?'current':''}"></i>`).join('');
}
function captureLoop(){
  if(!capture || !capture.running) return;
  capture.pos += capture.dir*capture.speed;
  if(capture.pos>=1){ capture.pos=1; capture.dir=-1; }
  if(capture.pos<=0){ capture.pos=0; capture.dir=1; }
  const needle = document.getElementById('captureNeedle');
  if(needle) needle.style.left = (capture.pos*100)+'%';
  requestAnimationFrame(captureLoop);
}
function doThrow(){
  if(!capture || capture.resolved) return;
  capture.running=false; capture.resolved=true;
  // Un Nœud Vert est consommé à chaque lancer, réussi ou non — comme une vraie Poké Ball.
  state.noeudsVerts = Math.max(0, state.noeudsVerts-1);
  saveLocal();
  renderStatusBar();
  const zoneW = RARITY_ZONE[capture.species.rarity];
  const inZone = capture.pos>=capture.zoneStart && capture.pos<=capture.zoneStart+zoneW;
  // Toucher la zone verte = capture de la manche, point final (comme l'indique le texte à l'écran) :
  // la difficulté vient de la largeur de zone (par rareté), du nombre de manches à enchaîner et
  // de la vitesse croissante de l'aiguille — pas d'un tirage au sort caché après un tir pourtant réussi.
  const success = inZone ? true : (Math.random() < 0.06);
  const portrait = document.getElementById('capturePortrait');
  document.getElementById('throwBtn').style.visibility='hidden';
  portrait.classList.add('shake');
  setTimeout(()=>{
    const wrap = document.getElementById('captureResultWrap');
    if(success){
      capture.roundsWon++;
      if(capture.roundsWon < capture.roundsTotal && state.noeudsVerts>0){
        portrait.classList.remove('shake');
        portrait.classList.add('round-won');
        setTimeout(()=> portrait && portrait.classList.remove('round-won'), 500);
        updateCaptureRounds();
        const left = capture.roundsTotal-capture.roundsWon;
        wrap.innerHTML = `<div class="capture-result partial" style="--rarity:var(--rarity-${capture.species.rarity});">Manche réussie !</div><p class="capture-hint">Encore ${left} manche${left>1?'s':''} pour le capturer.</p>`;
        capture.zoneStart = Math.max(0.06, Math.min(1-zoneW-0.06, Math.random()*(1-zoneW)));
        const zoneEl = document.getElementById('captureZone');
        if(zoneEl) zoneEl.style.left = (capture.zoneStart*100)+'%';
        capture.speed = Math.min(capture.speed+0.006, 0.05);
        capture.pos=0; capture.dir=1; capture.resolved=false; capture.running=true;
        document.getElementById('throwBtn').style.visibility='visible';
        setTimeout(()=>{ if(capture) wrap.innerHTML=''; }, 900);
        requestAnimationFrame(captureLoop);
      } else if(capture.roundsWon < capture.roundsTotal){
        // Plus aucun Nœud Vert pour enchaîner une manche supplémentaire : la cible s'échappe,
        // malgré la dernière manche réussie (comme à court de Poké Balls face à un Pokémon coriace).
        wrap.innerHTML = `<div class="capture-result fail">Plus de Nœud Vert : il s'échappe…</div><p class="capture-hint">Refaites une réserve sur un point d'intérêt avant de retenter votre chance.</p><button class="btn btn-ghost" id="captureDoneBtn" style="margin-top:10px;">Fermer</button>`;
        document.getElementById('captureDoneBtn').onclick = closeCapture;
      } else {
        applyCapture(capture.species, capture.spawnUid);
        wrap.innerHTML = `<div class="capture-result success">Capturé !</div><p class="capture-hint">+${RARITY_XP[capture.species.rarity]} exp · +${RARITY_CANDY[capture.species.rarity]} pièces</p><button class="btn btn-primary" id="captureDoneBtn" style="margin-top:10px;">Continuer</button>`;
        document.getElementById('captureDoneBtn').onclick = closeCapture;
        // Confettis de célébration (Version 23, demande de Jérémy) sur une capture réellement
        // terminée (toutes les manches gagnées) — un moment plus marquant qu'un simple point
        // d'intérêt, avec une palette multicolore festive plutôt que la palette dorée réservée
        // aux récompenses de pièces.
        if(portrait){
          const c = elementCenter(portrait);
          spawnParticles(c.x, c.y, ['#eab545','#ff6b6b','#4fc3f7','#81c784','#c77dff','#ffd873'], {count:42, spread:130, confetti:true});
        }
      }
    } else {
      const outOfNoeuds = state.noeudsVerts<=0;
      wrap.innerHTML = `<div class="capture-result fail">Il s'est échappé…</div><p class="capture-hint">Retentez votre chance sur un prochain passage.</p>${outOfNoeuds?`<p class="capture-hint" style="color:var(--brick-dark); font-weight:700;">Plus de Nœud Vert ! Direction un point d'intérêt pour vous refaire une réserve.</p>`:''}<button class="btn btn-ghost" id="captureDoneBtn" style="margin-top:10px;">Fermer</button>`;
      document.getElementById('captureDoneBtn').onclick = closeCapture;
    }
  }, 380);
}
function applyCapture(species, spawnUid){
  const mult = eventBonusMultiplier();
  const entry = state.captures[species.id] || {stage:0, candy:0};
  entry.candy += RARITY_CANDY[species.rarity]*mult;
  entry.caughtAt = new Date().toISOString();
  state.captures[species.id] = entry;
  state.xp += RARITY_XP[species.rarity]*mult;
  state.coins += Math.round(RARITY_CANDY[species.rarity]/2)*mult;
  if(usingLiveMerchants) state.captureCooldowns[species.id] = Date.now();
  saveLocal();
  renderStatusBar();
  respawnOne(spawnUid);
  renderSpawnMarkers();
  checkMissions();
}
function closeCapture(){ capture=null; document.getElementById('modalRoot').innerHTML=''; }

/* ============================= STATUS BAR ============================= */
function renderStatusBar(){
  const bar = document.getElementById('statusBar');
  const lvl = levelFromXp(state.xp);
  const cur = xpForLevel(lvl), next = xpForLevel(lvl+1);
  const pct = Math.max(0,Math.min(100, Math.round((state.xp-cur)/(next-cur)*100)));
  bar.innerHTML = `
    <div class="pill">
      <div class="badge-circle">${lvl}</div>
      <div><small>Niveau</small><div class="xpbar"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="pill gold">
      <div>${coinIcon(17)}</div>
      <div>${state.coins}<br><small style="margin-top:-2px;">pièces</small></div>
    </div>
    <div class="pill green">
      <div>${icon('noeud', 'style="width:15px;height:15px;stroke:var(--green-dark, var(--green))"')}</div>
      <div>${state.noeudsVerts}<br><small style="margin-top:-2px;">Nœud Vert</small></div>
    </div>`;
  renderMapLevelBadge();
}
// Badge niveau + Nœud Vert visible dans le coin bas-gauche de la carte (demande de Jérémy pour le
// niveau ; le Nœud Vert a été ajouté ici aussi en Version 18, pour la même raison : c'est la
// ressource qu'on consomme en tentant une capture directement depuis la carte, le joueur doit
// pouvoir la voir sans quitter cet écran). Tenu à jour à chaque appel de renderStatusBar(), donc
// toujours synchro avec l'état réel. Un tap sur le niveau ouvre l'onglet Profil, comme un raccourci.
function renderMapLevelBadge(){
  const el = document.getElementById('mapLevelBadge');
  if(!el) return;
  const lvl = levelFromXp(state.xp);
  const cur = xpForLevel(lvl), next = xpForLevel(lvl+1);
  const pct = Math.max(0,Math.min(100, Math.round((state.xp-cur)/(next-cur)*100)));
  el.innerHTML = `<div class="pill" id="mapLevelBadgeBtn" title="Voir mon profil">
      <div class="badge-circle">${lvl}</div>
      <div><small>Niveau</small><div class="xpbar"><i style="width:${pct}%"></i></div></div>
    </div>
    <div class="pill green" title="Nœuds Verts">
      <div>${icon('noeud', 'style="width:15px;height:15px;stroke:var(--green-dark, var(--green))"')}</div>
      <div>${state.noeudsVerts}<br><small style="margin-top:-2px;">Nœud Vert</small></div>
    </div>`;
  const btn = document.getElementById('mapLevelBadgeBtn');
  if(btn) btn.addEventListener('click', ()=> switchView('profile'));
}

/* ============================= DEX SCREEN ============================= */
function renderDex(){
  const el = document.getElementById('dexScreen');
  const caughtCount = Object.keys(state.captures).length;
  let cards = ACTIVE_MERCHANTS.map(sp=>{
    const entry = state.captures[sp.id];
    const caught = !!entry;
    const stageIdx = caught? Math.min(entry.stage, sp.stages.length-1) : 0;
    const stage = sp.stages[stageIdx];
    const pips = sp.stages.map((_,i)=>`<i class="${i<=stageIdx && caught?'on':''}"></i>`).join('');
    const shinyOn = caught && isShinyActive(sp.shiny);
    const dexBadge = (caught && sp.image) ? `<img src="${sp.image}" alt="">` : icon(sp.icon);
    return `<div class="dex-card ${caught?'':'locked'}" data-sp="${sp.id}">
      <div class="icon-wrap" style="--rarity:${shinyOn?(sp.shiny.color||'#d9a441'):`var(--rarity-${sp.rarity})`};">${shinyOn?'<span class="dex-shiny-spark">✨</span>':''}${dexBadge}</div>
      <div class="name">${caught? escapeHtml(sp.name||stage.name) : '???'}</div>
      <div class="stagepips">${pips}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<h1>Pokemerçants</h1><p class="sub">${caughtCount} / ${ACTIVE_MERCHANTS.length} découverts</p><div class="dex-grid">${cards}</div>`;
  el.querySelectorAll('.dex-card').forEach(c=> c.addEventListener('click', ()=> openDexDetail(c.dataset.sp)));
}
function openDexDetail(spId){
  const sp = getSpeciesById(spId);
  const entry = state.captures[spId];
  const caught = !!entry;
  const stageIdx = caught? Math.min(entry.stage, sp.stages.length-1): 0;
  const stage = sp.stages[stageIdx];
  const canEvolve = caught && stage.need!=null && entry.candy>=stage.need;
  const nextStage = caught && stage.need!=null ? sp.stages[stageIdx+1] : null;
  const shinyOn = caught && isShinyActive(sp.shiny);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;">
      <span class="rarity-tag ${sp.rarity}">${RARITY_LABEL[sp.rarity]}</span>
      ${shinyOn?`<span class="tag-shiny">✨ ${escapeHtml(sp.shiny.label||'Shiny')}</span>`:''}
      <div class="icon-wrap" style="--rarity:${shinyOn?(sp.shiny.color||'#d9a441'):`var(--rarity-${sp.rarity})`}; width:80px;height:80px;${caught?'':'filter:grayscale(1) opacity(.5);'}">${(caught && sp.image)?`<img src="${sp.image}" alt="">`:icon(sp.icon,'style="width:38px;height:38px;"')}</div>
      <h2 class="capture-name">${caught? escapeHtml(sp.name||stage.name) : '???'}</h2>
      ${(caught && sp.name && sp.name!==stage.name)?`<p class="capture-stage-name">${escapeHtml(stage.name)}</p>`:''}
      <p class="capture-hint" style="max-width:320px;">${caught? escapeHtml(sp.description||stage.desc) : "Pas encore rencontré. Explorez la carte pour le trouver."}</p>
      ${caught? `<p class="capture-hint">Pièces : <strong style="color:var(--ink);">${entry.candy}</strong>${stage.need!=null?` / ${stage.need} pour évoluer`:''}</p>`:''}
      ${nextStage? `<button class="btn ${canEvolve?'btn-gold':'btn-ghost'}" id="evolveBtn" ${canEvolve?'':'disabled'} style="margin-top:8px;">Faire évoluer${canEvolve?` → ${escapeHtml(nextStage.name)}`:''}</button>`:''}
      ${(caught && sp.battleEnabled)? `<button class="btn btn-gold" id="battleBtn" style="margin-top:8px;">⚔️ Défier ${escapeHtml(sp.name||stage.name)}</button>`:''}
      <button class="btn btn-ghost" id="closeSheetBtn" style="margin-top:8px;">Fermer</button>
    </div>
  </div></div>`;
  document.getElementById('sheetBackdrop').addEventListener('click', e=>{ if(e.target.id==='sheetBackdrop') closeSheet(); });
  document.getElementById('closeSheetBtn').onclick = closeSheet;
  const evBtn = document.getElementById('evolveBtn');
  if(evBtn) evBtn.onclick = ()=>{
    entry.candy -= stage.need;
    entry.stage = stageIdx+1;
    saveLocal(); renderStatusBar();
    closeSheet(); renderDex();
    showToast(`${stage.name} a évolué en ${nextStage.name} !`);
  };
  const battleBtn = document.getElementById('battleBtn');
  if(battleBtn) battleBtn.onclick = ()=> openBattleSheet(sp);
}
function closeSheet(){ document.getElementById('modalRoot').innerHTML=''; }

/* ============================= COMBAT EN BOUTIQUE (code + roue de la chance) =============================
   Le code secret de chaque commerçant n'existe jamais côté joueur : il est écrit/affiché en boutique
   (voir le panel admin), et vérifié uniquement par le serveur (POST /verify-battle-code, src/worker.js),
   qui contrôle aussi la proximité GPS avant de renvoyer une récompense. Le seul rôle du navigateur ici
   est d'envoyer le code tapé et d'animer/afficher ce que le serveur a décidé. */
const BATTLE_SEGMENTS = [
  { type:'xp_small', color:'var(--blue-100)', emoji:'⭐' },
  { type:'coins_small', color:'var(--gold-100)', emoji:'🪙' },
  { type:'xp_big', color:'var(--blue-500)', emoji:'✨' },
  { type:'coins_big', color:'var(--gold)', emoji:'💰' },
  { type:'jackpot', color:'var(--brick)', emoji:'💥' },
];
const BATTLE_COUPON_SEGMENT = { type:'coupon', color:'var(--rarity-rare)', emoji:'🎁' };

function openBattleSheet(sp){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="sheet-backdrop" id="battleBackdrop"><div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;">
      <h2 class="capture-name">⚔️ Défier ${escapeHtml(sp.name||'ce commerçant')}</h2>
      <p class="capture-hint" style="max-width:300px;">Le code se trouve chez le commerçant. Entrez-le ici, sur place, pour tenter votre chance à la roue.</p>
      <input id="battleCodeInput" class="battle-code-input" type="text" maxlength="16" autocomplete="off" autocapitalize="characters" placeholder="CODE">
      <p class="capture-hint" id="battleError" style="color:var(--brick-dark); display:none;"></p>
      <button class="btn btn-gold" id="battleSubmitBtn" style="margin-top:4px;">Valider le code</button>
      <button class="btn btn-ghost" id="battleCancelBtn">Annuler</button>
    </div>
  </div></div>`;
  document.getElementById('battleBackdrop').addEventListener('click', e=>{ if(e.target.id==='battleBackdrop') closeSheet(); });
  document.getElementById('battleCancelBtn').onclick = closeSheet;
  document.getElementById('battleSubmitBtn').onclick = ()=> submitBattleCode();
  const input = document.getElementById('battleCodeInput');
  input.focus();
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') submitBattleCode(); });
}

async function submitBattleCode(){
  const input = document.getElementById('battleCodeInput');
  const errEl = document.getElementById('battleError');
  const btn = document.getElementById('battleSubmitBtn');
  if(!input || !errEl || !btn) return;
  const code = input.value.trim();
  errEl.style.display='none';
  if(!code){ errEl.textContent='Entrez un code.'; errEl.style.display='block'; return; }
  if(curLat===null){ errEl.textContent='En attente de votre position GPS...'; errEl.style.display='block'; return; }
  btn.disabled = true; btn.textContent = 'Vérification...';
  let res, body;
  try{
    res = await fetch('./verify-battle-code', {
      method:'POST', headers:{'content-type':'application/json'},
      body: JSON.stringify({ code, lat: curLat, lon: curLon })
    });
    body = await res.json();
  }catch(e){
    btn.disabled = false; btn.textContent = 'Valider le code';
    errEl.textContent = "Impossible de contacter le serveur — vérifiez votre connexion.";
    errEl.style.display='block';
    return;
  }
  if(!res.ok || !body || !body.ok){
    btn.disabled = false; btn.textContent = 'Valider le code';
    errEl.textContent = (body && body.error) ? body.error : 'Code invalide.';
    errEl.style.display='block';
    return;
  }
  const cooldownMs = 24*60*60*1000;
  const last = state.battleCooldowns[body.merchantId]||0;
  const remain = cooldownMs-(Date.now()-last);
  if(remain>0){
    closeSheet();
    showToast(`Vous avez déjà défié ${body.merchantName} aujourd'hui — revenez dans ${Math.ceil(remain/3600000)} h.`);
    return;
  }
  state.battleCooldowns[body.merchantId] = Date.now();
  saveLocal();
  openBattleWheel(body.merchantId, body.merchantName, body.reward);
}

function battleSegmentsFor(merchantId, reward){
  const merchant = getSpeciesById(merchantId);
  const hasCoupon = (merchant && merchant.battleCouponLabel && merchant.battleCouponLabel.trim()) || reward.type==='coupon';
  const segs = BATTLE_SEGMENTS.slice();
  if(hasCoupon) segs.push(BATTLE_COUPON_SEGMENT);
  return segs;
}
function battleRewardText(reward){
  switch(reward.type){
    case 'xp_small': case 'xp_big': return `+${reward.xp} exp`;
    case 'coins_small': case 'coins_big': return `+${reward.coins} pièces`;
    case 'jackpot': return `JACKPOT ! +${reward.xp} exp et +${reward.coins} pièces`;
    case 'coupon': return `🎁 ${escapeHtml(reward.couponLabel||'Bon de réduction')} — montrez cet écran en caisse (code ${escapeHtml(reward.couponCode||'')})${reward.xp?` · +${reward.xp} exp`:''}`;
    default: return '';
  }
}
function openBattleWheel(merchantId, merchantName, reward){
  const segs = battleSegmentsFor(merchantId, reward);
  const n = segs.length;
  const slice = 360/n;
  const stops = segs.map((s,i)=> `${s.color} ${i*slice}deg ${(i+1)*slice}deg`).join(', ');
  const labels = segs.map((s,i)=>{
    const angle = (i+0.5)*slice;
    return `<div class="battle-wheel-label" style="transform:rotate(${angle}deg) translateY(-84px);"><span style="display:inline-block; transform:rotate(${-angle}deg);">${s.emoji}</span></div>`;
  }).join('');
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="sheet-backdrop" id="wheelBackdrop"><div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;">
      <h2 class="capture-name">⚔️ Combat chez ${escapeHtml(merchantName)}</h2>
      <div class="battle-wheel-wrap">
        <div class="battle-wheel-pointer"></div>
        <div class="battle-wheel" id="battleWheel" style="background:conic-gradient(${stops});">${labels}</div>
        <div class="battle-wheel-hub">🎯</div>
      </div>
      <p class="capture-hint" id="battleResultText" style="min-height:20px;">La roue tourne...</p>
      <button class="btn btn-gold" id="battleCloseBtn" style="margin-top:6px; display:none;">Super !</button>
    </div>
  </div></div>`;
  const idx = segs.findIndex(s=> s.type===reward.type);
  const segIndex = idx>=0? idx : 0;
  const targetAngle = (segIndex+0.5)*slice;
  const spins = 6;
  const finalRotation = spins*360 + targetAngle;
  const wheelEl = document.getElementById('battleWheel');
  requestAnimationFrame(()=>{ wheelEl.style.transform = `rotate(${finalRotation}deg)`; });
  setTimeout(()=>{
    applyBattleReward(reward);
    const resultEl = document.getElementById('battleResultText');
    if(resultEl) resultEl.innerHTML = `<strong style="color:var(--ink);">${battleRewardText(reward)}</strong>`;
    const closeBtn = document.getElementById('battleCloseBtn');
    if(closeBtn){ closeBtn.style.display='inline-flex'; closeBtn.onclick = closeSheet; }
  }, 3300);
}
function applyBattleReward(reward){
  if(reward.xp) state.xp += reward.xp;
  if(reward.coins) state.coins += reward.coins;
  saveLocal();
  renderStatusBar();
  checkMissions();
}

        <div style="display:flex;gap:10px;align-items:center;">
          <div class="icon-wrap" style="width:44px;height:44px;--rarity:var(--gold);">${icon(ev.icon,'style="width:20px;height:20px;"')}</div>

/* ============================= PROFILE SCREEN ============================= */
const BADGES = [
  {id:'first', icon:'star', label:'Première capture', test:s=>Object.keys(s.captures).length>=1},
  {id:'five', icon:'trophy', label:'5 commerçants', test:s=>Object.keys(s.captures).length>=5},
  {id:'all', icon:'compass', label:'Collection complète', test:s=>ACTIVE_MERCHANTS.length>0 && Object.keys(s.captures).length>=ACTIVE_MERCHANTS.length},
  {id:'legend', icon:'vase', label:'Trouver le Faïencier', test:s=>!!s.captures['faiencerie']},
];

/* ============================= DONNÉES DU PANEL ADMIN (gamedata.json) ============================= */
// Si gamedata.json existe et contient des commerçants placés, le jeu bascule sur les vraies données ;
// sinon il continue de fonctionner avec les commerçants fictifs de démonstration ci-dessus.
let gameData = null;
let usingLiveMerchants = false;
let ACTIVE_MERCHANTS = SPECIES;
let ACTIVE_POIS = POI_DEFS;
let ACTIVE_EVENTS = EVENTS;
let ACTIVE_MISSIONS = [];
let ACTIVE_BADGES = BADGES;

async function loadGameData(){
  try{
    const res = await fetch('./gamedata.json', {cache:'no-store'});
    if(!res.ok) return;
    const json = await res.json();
    if(json && typeof json==='object') gameData = json;
  }catch(e){ /* pas de fichier ou hors-ligne : on reste sur les données de démonstration */ }
}
function applyGameData(){
  if(!gameData) return;
  const liveMerchants = (gameData.merchants||[]).filter(m=> m.active!==false && m.lat!=null && m.lon!=null);
  if(liveMerchants.length){
    usingLiveMerchants = true;
    ACTIVE_MERCHANTS = liveMerchants.map(m=>({
      id:m.id, icon:m.icon||'basket', rarity:m.rarity||'commun', name:m.name||'Commerçant',
      category:m.category||'', description:m.description||'', image:m.image||null,
      lat:m.lat, lon:m.lon, shiny:m.shiny||null,
      // Note : le code secret de combat (battleCode) n'est jamais présent ici — le
      // serveur le retire de gamedata.json avant de le servir, voir src/worker.js.
      battleEnabled:!!m.battleEnabled, battleCouponLabel:m.battleCouponLabel||'',
      stages:(m.stages&&m.stages.length)? m.stages.map(s=>({name:s.name||m.name||'Stade', desc:s.desc||'', need:s.need!=null?s.need:null}))
                                         : [{name:m.name||'Commerçant', desc:m.description||'', need:null}]
    }));
  }
  const livePois = (gameData.pois||[]).filter(p=> p.active!==false && p.lat!=null && p.lon!=null);
  if(livePois.length){
    ACTIVE_POIS = livePois.map(p=>({
      name:p.name||"Point d'intérêt", icon:p.icon||'stall', lat:p.lat, lon:p.lon,
      rewardCoinsMin: p.rewardCoinsMin!=null?p.rewardCoinsMin:2,
      rewardCoinsMax: p.rewardCoinsMax!=null?p.rewardCoinsMax:4,
      rewardXp: p.rewardXp!=null?p.rewardXp:15,
      rewardNoeudsMin: p.rewardNoeudsMin!=null?p.rewardNoeudsMin:1,
      rewardNoeudsMax: p.rewardNoeudsMax!=null?p.rewardNoeudsMax:3
    }));
  }
  const liveEvents = (gameData.events||[]).filter(ev=> ev.active!==false && ev.start && ev.end);
  if(liveEvents.length){
    ACTIVE_EVENTS = liveEvents.map(ev=>({
      id:ev.id, name:ev.name||'Évènement', icon:ev.icon||'star',
      start:new Date(ev.start), end:new Date(ev.end),
      desc:ev.description||'', bonus:ev.bonusLabel||'', bonusType:ev.bonusType||'none', bonusSpeciesId:ev.bonusSpeciesId||''
    }));
  }
  if(gameData.chestRewards && typeof gameData.chestRewards==='object'){
    const merged = {};
    CHEST_COLORS.forEach(c=>{
      const d = DEFAULT_CHEST_REWARDS[c], g = gameData.chestRewards[c]||{};
      merged[c] = { xp: g.xp!=null?g.xp:d.xp, coins: g.coins!=null?g.coins:d.coins };
    });
    ACTIVE_CHEST_REWARDS = merged;
  }
  if(gameData.shopConfig && typeof gameData.shopConfig==='object'){
    const sc = gameData.shopConfig;
    if(sc.keyPrices && typeof sc.keyPrices==='object'){
      const merged = {};
      CHEST_COLORS.forEach(c=>{ merged[c] = sc.keyPrices[c]!=null ? sc.keyPrices[c] : DEFAULT_KEY_PRICES[c]; });
      ACTIVE_KEY_PRICES = merged;
    }
    if(sc.chestSkipPrices && typeof sc.chestSkipPrices==='object'){
      const merged = {};
      CHEST_COLORS.forEach(c=>{ merged[c] = sc.chestSkipPrices[c]!=null ? sc.chestSkipPrices[c] : DEFAULT_CHEST_SKIP_PRICES[c]; });
      ACTIVE_CHEST_SKIP_PRICES = merged;
    }
    ACTIVE_NOEUD_PRICE = sc.noeudPrice!=null ? sc.noeudPrice : DEFAULT_NOEUD_PRICE;
  }
  if(gameData.dropConfig && typeof gameData.dropConfig==='object'){
    const dc = gameData.dropConfig;
    if(dc.weights && typeof dc.weights==='object'){
      const merged = {};
      CHEST_COLORS.forEach(c=>{ merged[c] = dc.weights[c]!=null ? dc.weights[c] : DEFAULT_CHEST_DROP_WEIGHTS[c]; });
      ACTIVE_CHEST_DROP_WEIGHTS = merged;
    }
    ACTIVE_CHEST_FIND_CHANCE = {
      key: dc.keyChance!=null ? dc.keyChance : DEFAULT_CHEST_FIND_CHANCE.key,
      chest: dc.chestChance!=null ? dc.chestChance : DEFAULT_CHEST_FIND_CHANCE.chest
    };
  }
  if(gameData.balloonConfig && typeof gameData.balloonConfig==='object'){
    const bc = gameData.balloonConfig;
    ACTIVE_BALLOON_CONFIG = {
      spawnIntervalMinMin: bc.spawnIntervalMinMin!=null ? bc.spawnIntervalMinMin : DEFAULT_BALLOON_CONFIG.spawnIntervalMinMin,
      spawnIntervalMaxMin: bc.spawnIntervalMaxMin!=null ? bc.spawnIntervalMaxMin : DEFAULT_BALLOON_CONFIG.spawnIntervalMaxMin,
      lifetimeMinutes: bc.lifetimeMinutes!=null ? bc.lifetimeMinutes : DEFAULT_BALLOON_CONFIG.lifetimeMinutes,
      spawnRadiusMin: bc.spawnRadiusMin!=null ? bc.spawnRadiusMin : DEFAULT_BALLOON_CONFIG.spawnRadiusMin,
      spawnRadiusMax: bc.spawnRadiusMax!=null ? bc.spawnRadiusMax : DEFAULT_BALLOON_CONFIG.spawnRadiusMax,
      maxActive: bc.maxActive!=null ? bc.maxActive : DEFAULT_BALLOON_CONFIG.maxActive,
      rewardCoinsMin: bc.rewardCoinsMin!=null ? bc.rewardCoinsMin : DEFAULT_BALLOON_CONFIG.rewardCoinsMin,
      rewardCoinsMax: bc.rewardCoinsMax!=null ? bc.rewardCoinsMax : DEFAULT_BALLOON_CONFIG.rewardCoinsMax,
      rewardXp: bc.rewardXp!=null ? bc.rewardXp : DEFAULT_BALLOON_CONFIG.rewardXp,
      rewardNoeudsMin: bc.rewardNoeudsMin!=null ? bc.rewardNoeudsMin : DEFAULT_BALLOON_CONFIG.rewardNoeudsMin,
      rewardNoeudsMax: bc.rewardNoeudsMax!=null ? bc.rewardNoeudsMax : DEFAULT_BALLOON_CONFIG.rewardNoeudsMax,
    };
  }
  ACTIVE_MISSIONS = (gameData.missions||[]).filter(mi=> mi.active!==false);
  const liveBadges = (gameData.badges||[]).filter(b=> b.active!==false);
  if(liveBadges.length){
    ACTIVE_BADGES = liveBadges.map(b=>({
      id:b.id, icon:b.icon||'medal', label:b.label||'Badge',
      test:(s)=>{
        if(b.criteriaType==='captures_count') return Object.keys(s.captures).length >= (b.criteriaValue||1);
        if(b.criteriaType==='species_captured') return !!s.captures[b.criteriaValue];
        if(b.criteriaType==='all_captured') return ACTIVE_MERCHANTS.length>0 && Object.keys(s.captures).length >= ACTIVE_MERCHANTS.length;
        if(b.criteriaType==='mission_completed') return !!(s.missionsCompleted && s.missionsCompleted[b.criteriaValue]);
        return false;
      }
    }));
  }
}

/* ============================= MISSIONS ============================= */
function missionProgress(mi){
  if(mi.type==='capture_count') return Object.keys(state.captures).length;
  if(mi.type==='poi_spin_count') return state.totalPoiSpins||0;
  if(mi.type==='catch_species') return state.captures[mi.targetSpeciesId] ? 1 : 0;
  if(mi.type==='catch_rarity') return Object.keys(state.captures).some(id=>{ const sp=getSpeciesById(id); return sp && sp.rarity===mi.targetRarity; }) ? 1 : 0;
  return 0;
}
function missionTarget(mi){
  if(mi.type==='capture_count' || mi.type==='poi_spin_count') return mi.target||1;
  return 1;
}
function checkMissions(){
  if(!ACTIVE_MISSIONS.length) return;
  let changed = false;
  ACTIVE_MISSIONS.forEach(mi=>{
    if(state.missionsCompleted[mi.id]) return;
    if(missionProgress(mi) >= missionTarget(mi)){
      state.missionsCompleted[mi.id] = true;
      state.xp += mi.rewardXp||0;
      state.coins += mi.rewardCoins||0;
      changed = true;
      showToast(`Mission accomplie : ${mi.title}${mi.rewardXp?` (+${mi.rewardXp} exp)`:''}`);
    }
  });
  if(changed){ saveLocal(); renderStatusBar(); }
}
function renderMissions(){
  const el = document.getElementById('missionsScreen');
  if(!ACTIVE_MISSIONS.length){
    el.innerHTML = `<h1>Missions</h1><p class="sub">Objectifs à accomplir en ville</p><div class="info-note">Aucune mission n'est configurée pour le moment.</div>`;
    return;
  }
  const cards = ACTIVE_MISSIONS.map(mi=>{
    const done = !!state.missionsCompleted[mi.id];
    const progress = Math.min(missionProgress(mi), missionTarget(mi));
    const target = missionTarget(mi);
    const pct = Math.max(0, Math.min(100, Math.round(progress/target*100)));
    const badge = mi.rewardBadgeId ? ACTIVE_BADGES.find(b=>b.id===mi.rewardBadgeId) : null;
    return `<div class="event-card ${done?'live':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="icon-wrap" style="width:44px;height:44px;--rarity:var(--blue-600);">${icon('flag','style="width:20px;height:20px;"')}</div>
          <strong style="font-family:'Fredoka';font-size:15px;">${escapeHtml(mi.title)}</strong>
        </div>
        <span class="event-tag ${done?'live':''}">${done?'Terminée':'En cours'}</span>
      </div>
      <p style="font-size:13px;color:var(--ink-soft);margin:10px 0 6px 0;">${escapeHtml(mi.description||'')}</p>
      <div class="mission-progress"><i style="width:${pct}%;background:${done?'var(--green)':'var(--blue-600)'};"></i></div>
      <p style="font-size:11px;color:var(--ink-faint);font-weight:700;margin:6px 0 0 0;">${progress} / ${target}${badge?' · Badge : '+escapeHtml(badge.label):''}</p>
      <p style="font-size:12px;font-weight:800;color:var(--gold-dark);margin:6px 0 0 0;">+${mi.rewardXp||0} exp · +${mi.rewardCoins||0} pièces</p>
    </div>`;
  }).join('');
  el.innerHTML = `<h1>Missions</h1><p class="sub">Objectifs à accomplir en ville</p>${cards}`;
}

/* ============================= INVENTAIRE (clés & coffres) ============================= */
function renderInventory(){
  const el = document.getElementById('inventoryScreen');
  if(!el) return;
  const opening = state.chestOpening;

  // Notification unique dès qu'un coffre en cours d'ouverture devient prêt.
  if(opening && !opening.notified && Date.now() >= opening.readyAt){
    opening.notified = true;
    saveLocal();
    showToast(`Le coffre ${CHEST_COLOR_LABEL[opening.color]} est prêt à être ouvert !`);
  }

  const keysHtml = CHEST_COLORS.map(c=>{
    const n = state.keys[c]||0;
    return `<div class="key-chip" style="--cc:var(--chest-${c});">
      <div class="key-chip-icon">${icon('key')}</div>
      <div class="key-chip-count">${n}</div>
      <div class="key-chip-label">${CHEST_COLOR_LABEL[c]}</div>
    </div>`;
  }).join('');

  let openingHtml = '';
  if(opening){
    const remain = opening.readyAt - Date.now();
    const ready = remain<=0;
    openingHtml = `<div class="chest-opening-card ${ready?'ready':''}" style="--cc:var(--chest-${opening.color});">
      <div class="chest-opening-icon">${icon('chest')}</div>
      <div class="chest-opening-info">
        <strong>Coffre ${CHEST_COLOR_LABEL[opening.color]} ${ready?'prêt !':'en cours…'}</strong>
        <span>${ready?'Appuyez pour récupérer votre butin.':fmtDuration(remain)+' restantes'}</span>
      </div>
      ${ready?`<button class="btn btn-gold" id="collectChestBtn">Ouvrir</button>`:''}
    </div>`;
  }

  const shownChests = state.chests.filter(c=> !opening || c.id!==opening.chestId);
  const chestsHtml = shownChests.length ? `<div class="chest-grid">${shownChests.map(c=>{
    const hasKey = (state.keys[c.color]||0) > 0;
    const canOpen = !opening && hasKey;
    const label = opening ? 'Occupé' : (hasKey ? 'Ouvrir avec une clé' : 'Clé requise');
    return `<div class="chest-card" style="--cc:var(--chest-${c.color});">
      <div class="chest-card-icon">${icon('chest')}</div>
      <div class="chest-card-label">Coffre ${CHEST_COLOR_LABEL[c.color]}</div>
      <button class="btn ${canOpen?'btn-primary':'btn-ghost'} chest-open-btn" data-id="${c.id}" ${canOpen?'':'disabled'} style="margin-top:8px;">${label}</button>
    </div>`;
  }).join('')}</div>` : `<p class="sub" style="margin-top:2px;">Aucun coffre pour l'instant — les points d'intérêt en font parfois trouver.</p>`;

  // Boutique : clés à l'unité, fin immédiate d'une ouverture en cours, échange contre des Nœuds Verts.
  const shopKeysHtml = CHEST_COLORS.map(c=>{
    const price = ACTIVE_KEY_PRICES[c];
    const afford = state.coins >= price;
    return `<div class="shop-key-card" style="--cc:var(--chest-${c});">
      <div class="key-chip-icon">${icon('key')}</div>
      <div class="key-chip-label">${CHEST_COLOR_LABEL[c]}</div>
      <div class="shop-key-price">${price} pièces</div>
      <button class="btn ${afford?'btn-primary':'btn-ghost'} shop-buy-key-btn" data-color="${c}" ${afford?'':'disabled'}>Acheter</button>
    </div>`;
  }).join('');
  let skipRowHtml = '';
  if(opening && Date.now() < opening.readyAt){
    const skipPrice = ACTIVE_CHEST_SKIP_PRICES[opening.color];
    const afford = state.coins >= skipPrice;
    skipRowHtml = `<div class="shop-row-card" style="--cc:var(--chest-${opening.color});">
      <div class="shop-row-icon">${icon('chest')}</div>
      <div class="shop-row-info"><strong>Terminer le coffre ${CHEST_COLOR_LABEL[opening.color]}</strong><span>Récupérez-le tout de suite, sans attendre.</span></div>
      <button class="btn ${afford?'btn-gold':'btn-ghost'}" id="shopSkipChestBtn" ${afford?'':'disabled'}>${skipPrice} pièces</button>
    </div>`;
  }
  const noeudAfford = state.coins >= ACTIVE_NOEUD_PRICE;
  const noeudRowHtml = `<div class="shop-row-card" style="--cc:var(--green);">
    <div class="shop-row-icon">${icon('noeud')}</div>
    <div class="shop-row-info"><strong>1 Nœud Vert</strong><span>Vous en avez ${state.noeudsVerts} en poche.</span></div>
    <button class="btn ${noeudAfford?'btn-primary':'btn-ghost'}" id="shopBuyNoeudBtn" ${noeudAfford?'':'disabled'}>${ACTIVE_NOEUD_PRICE} pièces</button>
  </div>`;

  el.innerHTML = `<h1>Inventaire</h1><p class="sub">Clés et coffres trouvés aux points d'intérêt</p>
    <h2 style="font-size:14px;margin:4px 0 10px 0;">Clés</h2>
    <div class="key-row">${keysHtml}</div>
    ${openingHtml}
    <h2 style="font-size:14px;margin:18px 0 10px 0;">Coffres</h2>
    ${chestsHtml}
    <div class="info-note" style="margin-top:18px;">Un seul coffre peut être ouvert à la fois. Lancer l'ouverture consomme une clé de la même couleur ; le minuteur va de 30 min (Jaune) à 12 h (Noir).</div>
    <h2 style="font-size:14px;margin:22px 0 10px 0;">Boutique <span style="font-weight:600;color:var(--ink-faint);">(contre des pièces)</span></h2>
    <div class="shop-balance">${coinIcon(20)}<span>Vous avez <strong>${state.coins}</strong> pièce${state.coins===1?'':'s'}</span></div>
    <div class="key-row">${shopKeysHtml}</div>
    ${skipRowHtml}
    ${noeudRowHtml}`;

  const collectBtn = document.getElementById('collectChestBtn');
  if(collectBtn) collectBtn.onclick = collectChest;
  el.querySelectorAll('.chest-open-btn').forEach(btn=>{
    if(!btn.disabled) btn.addEventListener('click', ()=> startChestOpen(btn.dataset.id));
  });
  el.querySelectorAll('.shop-buy-key-btn').forEach(btn=>{
    if(!btn.disabled) btn.addEventListener('click', ()=> buyKey(btn.dataset.color));
  });
  const skipBtn = document.getElementById('shopSkipChestBtn');
  if(skipBtn && !skipBtn.disabled) skipBtn.onclick = buySkipChest;
  const noeudBtn = document.getElementById('shopBuyNoeudBtn');
  if(noeudBtn && !noeudBtn.disabled) noeudBtn.onclick = buyNoeud;
}
function buyKey(color){
  const price = ACTIVE_KEY_PRICES[color];
  if(state.coins < price){ showToast(`Pas assez de pièces (il faut ${price}).`); return; }
  state.coins -= price;
  state.keys[color] = (state.keys[color]||0)+1;
  saveLocal();
  renderStatusBar();
  renderInventory();
  showToast(`Clé ${CHEST_COLOR_LABEL[color]} achetée (−${price} pièces).`);
}
function buySkipChest(){
  const opening = state.chestOpening;
  if(!opening || Date.now() >= opening.readyAt) return;
  const price = ACTIVE_CHEST_SKIP_PRICES[opening.color];
  if(state.coins < price){ showToast(`Pas assez de pièces (il faut ${price}).`); return; }
  state.coins -= price;
  opening.readyAt = Date.now();
  saveLocal();
  renderStatusBar();
  renderInventory();
  showToast(`Ouverture terminée immédiatement (−${price} pièces) !`);
}
function buyNoeud(){
  const price = ACTIVE_NOEUD_PRICE;
  if(state.coins < price){ showToast(`Pas assez de pièces (il faut ${price}).`); return; }
  state.coins -= price;
  state.noeudsVerts += 1;
  saveLocal();
  renderStatusBar();
  renderInventory();
  showToast(`+1 Nœud Vert (−${price} pièces) !`);
}
function startChestOpen(chestId){
  if(state.chestOpening){ showToast('Un coffre est déjà en cours d’ouverture.'); return; }
  const chest = state.chests.find(c=>c.id===chestId);
  if(!chest) return;
  const color = chest.color;
  if(!((state.keys[color]||0) > 0)){ showToast(`Il vous faut une clé ${CHEST_COLOR_LABEL[color]} pour ouvrir ce coffre.`); return; }
  state.keys[color] -= 1;
  state.chestOpening = { chestId, color, startedAt: Date.now(), readyAt: Date.now()+CHEST_OPEN_MS[color], notified:false };
  saveLocal();
  renderInventory();
  showToast(`Ouverture du coffre ${CHEST_COLOR_LABEL[color]} lancée (${fmtDuration(CHEST_OPEN_MS[color])}).`);
}
function collectChest(){
  const opening = state.chestOpening;
  if(!opening || Date.now() < opening.readyAt) return;
  // Position de la gerbe de particules capturée AVANT le re-rendu de l'Inventaire (qui va faire
  // disparaître cette carte) — le calque de particules est indépendant du reste de la page (position
  // fixed), donc l'effet reste visible même une fois la carte remplacée par la liste mise à jour.
  const openingIconEl = document.querySelector('.chest-opening-card .chest-opening-icon');
  const burstColors = [
    getComputedStyle(document.documentElement).getPropertyValue('--chest-'+opening.color).trim() || '#eab545',
    '#eab545', '#ffd873', '#ffffff'
  ];
  const reward = ACTIVE_CHEST_REWARDS[opening.color] || DEFAULT_CHEST_REWARDS[opening.color];
  state.xp += reward.xp;
  state.coins += reward.coins;
  state.chests = state.chests.filter(c=>c.id!==opening.chestId);
  state.chestOpening = null;
  saveLocal();
  renderStatusBar();
  renderInventory();
  if(openingIconEl){
    const c = elementCenter(openingIconEl);
    spawnParticles(c.x, c.y, burstColors, {count:26, spread:110, ring:true, ringSize:70});
  }
  showToast(`Coffre ${CHEST_COLOR_LABEL[opening.color]} ouvert ! +${reward.xp} exp, +${reward.coins} pièces.`);
  checkMissions();
}

  const el = document.getElementById('profileScreen');

  const totalCaught = Object.keys(state.captures).length;

    const earned = b.test(state);
    return `<div class="badge-item ${earned?'earned':''}"><div class="badge-circle-lg">${icon(b.icon,'style="'+ (earned?'':'stroke:var(--ink-faint)')+'"')}</div><span>${escapeHtml(b.label)}</span></div>`;
  }).join('');
  el.innerHTML = `<h1>${escapeHtml(state.trainerName||'Dresseur')}</h1><p class="sub">Niveau ${lvl} · Nevers</p>
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px 16px;box-shadow:var(--shadow-sm);">
      <div class="profile-stat"><span>Pokemerçants découverts</span><strong>${totalCaught} / ${ACTIVE_MERCHANTS.length}</strong></div>
      <div class="profile-stat"><span>Évolutions réalisées</span><strong>${totalEvolved}</strong></div>

      <div class="profile-stat"><span>Nœuds Verts en poche</span><strong>${state.noeudsVerts}</strong></div>

    <h2 style="font-size:16px;margin:22px 0 0 0;">Badges</h2>
    <div class="badge-grid">${badgeHtml}</div>
    <h2 style="font-size:16px;margin:22px 0 0 0;">Sauvegarde multi-appareils</h2>
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);">
      ${state.syncCode ? `
        <p style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:0 0 8px 0;">Notez ce code pour retrouver votre progression sur un autre appareil :</p>
        <div style="display:flex;align-items:center;gap:8px;">
          <code style="flex:1;font-family:'Fredoka';font-size:17px;letter-spacing:.04em;background:var(--surface-alt);border-radius:var(--radius-sm);padding:10px 12px;text-align:center;">${state.syncCode}</code>
          <button class="btn btn-ghost" id="copySyncBtn" style="width:auto;padding:10px 14px;">Copier</button>
        </div>
        <p style="font-size:11px;color:var(--ink-faint);font-weight:700;margin:8px 0 0 0;">Sauvegardée automatiquement à chaque changement, dès que la connexion réseau le permet.</p>
      ` : `
        <p style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:0 0 10px 0;">Créez un code pour retrouver votre progression si vous changez de téléphone.</p>
        <button class="btn btn-primary" id="createSyncBtn">Créer un code de sauvegarde</button>
      `}
      <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:12px;">
        <p style="font-size:12px;color:var(--ink-soft);font-weight:700;margin:0 0 8px 0;">${state.syncCode ? "Changer d'appareil ou utiliser un autre code :" : 'Vous avez déjà un code ?'}</p>
        <div style="display:flex;gap:8px;">
          <input class="text-input" id="restoreCodeInput" placeholder="XXXXX-XXXXX" style="flex:1;text-transform:uppercase;">
          <button class="btn btn-ghost" id="restoreSyncBtn" style="width:auto;padding:0 16px;">Restaurer</button>
        </div>
      </div>
    </div>
    <div class="info-note">${usingLiveMerchants ? "Vrais commerçants de Nevers, vraie carte OpenStreetMap et vrai GPS." : "Version prototype : commerçants fictifs, mais vraie carte OpenStreetMap et vrai GPS. Un panel d'administration permet d'ajouter les vrais commerçants, POI et évènements."} Sans code de sauvegarde, la progression reste uniquement sur cet appareil.</div>
    <button class="btn btn-ghost" id="resetBtn" style="margin-top:16px;">Réinitialiser ma progression</button>`;
  const copyBtn = document.getElementById('copySyncBtn');
  if(copyBtn) copyBtn.onclick = ()=>{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(state.syncCode).then(()=> showToast('Code copié !')).catch(()=> showToast(state.syncCode));
    } else showToast(state.syncCode);
  };
  const createBtn = document.getElementById('createSyncBtn');
  if(createBtn) createBtn.onclick = async ()=>{
    createBtn.disabled = true; createBtn.textContent = 'Création…';
    state.syncCode = genSyncCode();
    saveLocal();
    const r = await syncNow();
    if(!r.ok) showToast('Code créé, mais synchronisation impossible pour le moment (réessai automatique dès que le réseau revient).');

  };
  const restoreBtn = document.getElementById('restoreSyncBtn');

    restoreBtn.disabled = true; const label = restoreBtn.textContent; restoreBtn.textContent = '…';

      const name = state.trainerName;
      const spawns = state.spawns;
      const syncCode = state.syncCode;
      state = defaultState(); state.trainerName=name; state.seenIntro=true; state.spawns=spawns; state.syncCode=syncCode;
      saveLocal(); renderAll();
    }
  };
}

/* ============================= NAV ============================= */
const TABS = [
  {id:'map', label:'Carte', icon:'map'},
  {id:'dex', label:'Pokemerçants', icon:'basket'},
  {id:'events', label:'Évènements', icon:'star'},
  {id:'missions', label:'Missions', icon:'flag'},
  {id:'inventory', label:'Inventaire', icon:'chest'},
  {id:'profile', label:'Profil', icon:'person'},
];
let activeView='map';
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map(t=>`<button class="tab ${activeView===t.id?'active':''}" data-tab="${t.id}">
    <span class="tab-icon-wrap">${icon(t.icon)}</span><span>${t.label}</span><span class="dot-ind"></span></button>`).join('');
  bar.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> switchView(b.dataset.tab)));
}
function switchView(v){
  activeView=v;
  document.getElementById('mapView').style.display = v==='map'?'block':'none';
  document.getElementById('dexScreen').style.display = v==='dex'?'block':'none';
  document.getElementById('eventsScreen').style.display = v==='events'?'block':'none';
  document.getElementById('missionsScreen').style.display = v==='missions'?'block':'none';
  document.getElementById('inventoryScreen').style.display = v==='inventory'?'block':'none';
  document.getElementById('profileScreen').style.display = v==='profile'?'block':'none';
  if(v==='dex') renderDex();
  if(v==='events') renderEvents();
  if(v==='missions') renderMissions();
  if(v==='inventory') renderInventory();
  if(v==='profile') renderProfile();
  renderTabbar();
  if(v==='map' && map) setTimeout(()=> map.invalidateSize(), 60);
}
function renderAll(){
  renderStatusBar();
  renderTabbar();
  switchView(activeView);
}

/* ============================= ONBOARDING ============================= */
function showOnboarding(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div id="onboardBackdrop"><div class="onboard-card">
    <p class="onboard-logo">Poke<span class="accent">Nevers</span></p>
    <p class="onboard-tag">Capturez les commerçants de votre ville</p>
    <p style="font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 0 16px 0;">Choisissez votre nom de dresseur. La page va ensuite vous demander l'accès à votre position — acceptez pour jouer avec le vrai GPS.</p>
    <input class="text-input" id="nameInput" placeholder="Votre prénom" maxlength="18" autofocus>
    <button class="btn btn-primary" id="startBtn" style="margin-top:14px;">Commencer l'aventure</button>
  </div></div>`;
  const input = document.getElementById('nameInput');
  const go = ()=>{
    const val = input.value.trim();
    state.trainerName = val || 'Dresseur';
    state.seenIntro = true;
    saveLocal();
    document.getElementById('modalRoot').innerHTML='';
    startGeo();
  };
  document.getElementById('startBtn').onclick = go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ============================= BOOT ============================= */
async function boot(){
  const saved = loadLocal();
  state = Object.assign(defaultState(), saved||{});
  // Complète les sauvegardes existantes créées avant l'ajout des missions/cooldowns.
  state.captures = state.captures || {};
  state.poiSpins = state.poiSpins || {};
  state.totalPoiSpins = state.totalPoiSpins || 0;
  state.captureCooldowns = state.captureCooldowns || {};
  state.missionsCompleted = state.missionsCompleted || {};
  state.battleCooldowns = state.battleCooldowns || {};
  state.keys = state.keys || {jaune:0, vert:0, bleu:0, violet:0, noir:0};
  CHEST_COLORS.forEach(c=>{ if(state.keys[c]==null) state.keys[c]=0; });
  state.chests = state.chests || [];
  state.chestOpening = state.chestOpening || null;
  state.syncCode = state.syncCode || null;
  // Version 18 : les sauvegardes créées avant l'ajout du Nœud Vert n'ont pas ce champ.
  if(state.noeudsVerts==null) state.noeudsVerts = STARTING_NOEUDS;
  // Version 21 : les sauvegardes créées avant l'ajout des ballons n'ont pas ces champs.
  state.balloons = state.balloons || [];
  state.nextBalloonSpawnAt = state.nextBalloonSpawnAt || 0;
  await loadGameData();
  applyGameData();
  initMap();
  renderAll();
  document.getElementById('geoRetryBtn').onclick = startGeo;
  if(state.seenIntro){ startGeo(); }
  else { showOnboarding(); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
  // Rafraîchit le compte à rebours de l'onglet Inventaire pendant qu'il est affiché,
  // sans rien faire le reste du temps (léger, une fois par seconde).
  setInterval(()=>{ if(activeView==='inventory') renderInventory(); }, 1000);
  // Vérifie régulièrement s'il faut faire apparaître un ballon ou en retirer un expiré — en plus
  // de l'appel fait à chaque nouvelle position GPS (onGeo), utile si le joueur reste immobile.
  setInterval(maybeSpawnBalloon, 20000);
}
document.addEventListener('DOMContentLoaded', boot);

})();
</script>
