<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>PokeNevers</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a56b0">
<meta name="description" content="Capturez les commerçants de Nevers sur une vraie carte, en vous promenant en ville.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PokeNevers">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --ink:#152238; --ink-soft:#4c5d7d; --ink-faint:#8695ab;
  --bg:#eef4fb; --surface:#ffffff; --surface-alt:#f5f0e2;
  --line:#dbe6f2;
  --blue-800:#0b2c56; --blue-700:#123b6b; --blue-600:#1a56b0; --blue-500:#2f86e6; --blue-400:#5aa3ef; --blue-100:#dcecff;
  --teal-500:#17a598; --teal-100:#d9f5ef;
  --gold:#eab545; --gold-dark:#a97a1f; --gold-light:#ffd873; --gold-100:#fcf0d2;
  --brick:#e2543a; --brick-dark:#b73f28;
  --green:#2fa25f; --green-100:#daf5e4;
  --rarity-commun:#5e8db3; --rarity-peu:#22a06b; --rarity-rare:#7c5ce8; --rarity-legendaire:#eab545;
  --rarity-commun-2:#8fb6d6; --rarity-peu-2:#57cf9a; --rarity-rare-2:#a891ff; --rarity-legendaire-2:#ffd873;
  --shadow-sm:0 2px 8px rgba(18,42,79,.12);
  --shadow-md:0 8px 20px rgba(18,42,79,.16);
  --shadow-lg:0 16px 40px rgba(18,42,79,.22);
  --radius-lg:24px; --radius-md:16px; --radius-sm:10px;
  --grad-sky: radial-gradient(120% 90% at 50% -10%, #eaf3ff 0%, var(--bg) 55%);
  --grad-primary: linear-gradient(135deg, var(--blue-500), var(--blue-700));
  --grad-gold: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#eaf1fb; --ink-soft:#aebedb; --ink-faint:#7c8bab;
    --bg:#0a121e; --surface:#131e2e; --surface-alt:#192434;
    --line:#26374e;
    --blue-800:#dcecff; --blue-700:#bcdcff; --blue-600:#6fabf3; --blue-500:#4a8de0; --blue-400:#3f7fca; --blue-100:#193459;
    --teal-500:#2ec9b9; --teal-100:#0f3630;
    --gold:#eec677; --gold-dark:#f3d28f; --gold-light:#ffe19a; --gold-100:#33280f;
    --brick:#ef7a5f; --brick-dark:#d65f42;
    --green:#5fce88; --green-100:#0f3322;
    --rarity-commun:#8fb0d4; --rarity-peu:#4fd393; --rarity-rare:#b09bff; --rarity-legendaire:#eec677;
    --rarity-commun-2:#b7d1ec; --rarity-peu-2:#8bf0c3; --rarity-rare-2:#d3c4ff; --rarity-legendaire-2:#ffe19a;
    --shadow-sm:0 2px 10px rgba(0,0,0,.4);
    --shadow-md:0 10px 24px rgba(0,0,0,.45);
    --shadow-lg:0 18px 44px rgba(0,0,0,.55);
    --grad-sky: radial-gradient(120% 90% at 50% -10%, #16233a 0%, var(--bg) 55%);
    --grad-primary: linear-gradient(135deg, var(--blue-500), var(--blue-800));
    --grad-gold: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --ink:#eaf1fb; --ink-soft:#aebedb; --ink-faint:#7c8bab;
  --bg:#0a121e; --surface:#131e2e; --surface-alt:#192434;
  --line:#26374e;
  --blue-800:#dcecff; --blue-700:#bcdcff; --blue-600:#6fabf3; --blue-500:#4a8de0; --blue-400:#3f7fca; --blue-100:#193459;
  --teal-500:#2ec9b9; --teal-100:#0f3630;
  --gold:#eec677; --gold-dark:#f3d28f; --gold-light:#ffe19a; --gold-100:#33280f;
  --brick:#ef7a5f; --brick-dark:#d65f42;
  --green:#5fce88; --green-100:#0f3322;
  --rarity-commun:#8fb0d4; --rarity-peu:#4fd393; --rarity-rare:#b09bff; --rarity-legendaire:#eec677;
  --rarity-commun-2:#b7d1ec; --rarity-peu-2:#8bf0c3; --rarity-rare-2:#d3c4ff; --rarity-legendaire-2:#ffe19a;
  --shadow-sm:0 2px 10px rgba(0,0,0,.4);
  --shadow-md:0 10px 24px rgba(0,0,0,.45);
  --shadow-lg:0 18px 44px rgba(0,0,0,.55);
  --grad-sky: radial-gradient(120% 90% at 50% -10%, #16233a 0%, var(--bg) 55%);
  --grad-primary: linear-gradient(135deg, var(--blue-500), var(--blue-800));
  --grad-gold: linear-gradient(135deg, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  color-scheme: dark;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--grad-sky); color:var(--ink);
  font-family:"Nunito",system-ui,-apple-system,sans-serif;
  font-variant-numeric:tabular-nums;
  overflow:hidden;
  -webkit-tap-highlight-color:transparent;
  user-select:none;
}
h1,h2,h3,.display{ font-family:"Fredoka",system-ui,sans-serif; text-wrap:balance; }
button{font-family:inherit;}
#app{position:fixed; inset:0; display:flex; flex-direction:column;}

/* ---------- top status bar ---------- */
#statusBar{
  position:absolute; top:0; left:0; right:0; z-index:410;
  display:flex; justify-content:space-between; align-items:flex-start;
  padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0 12px;
  pointer-events:none;
}
.pill{
  pointer-events:auto;
  display:flex; align-items:center; gap:7px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);
  backdrop-filter:blur(10px);
  border:1px solid color-mix(in srgb, var(--line) 70%, transparent);
  border-radius:999px; padding:5px 14px 5px 5px;
  box-shadow:var(--shadow-md);
  font-weight:800; font-size:13px;
}
.pill .badge-circle{
  width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  background:var(--grad-primary); color:#fff; font-family:"Fredoka"; font-size:13px;
  flex:none; box-shadow:0 2px 6px color-mix(in srgb, var(--blue-600) 55%, transparent);
}
.pill.gold .badge-circle{background:var(--grad-gold); color:var(--blue-800); box-shadow:0 2px 6px color-mix(in srgb, var(--gold) 55%, transparent);}
.pill .xpbar{width:52px;height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:3px;}
.pill .xpbar > i{display:block;height:100%;background:var(--grad-primary);border-radius:3px;}
.pill small{display:block;font-size:9px;font-weight:700;color:var(--ink-faint);letter-spacing:.04em;text-transform:uppercase;}

/* ---------- MAP VIEW (Leaflet) ---------- */
#mapView{position:absolute;inset:0;overflow:hidden;background:var(--bg);}
/* mapRotator is oversized (150%) so rotating it in compass mode never reveals empty corners;
   #mapView clips it back down with overflow:hidden. */
#mapRotator{position:absolute; top:50%; left:50%; width:150%; height:150%; transform-origin:50% 50%; will-change:transform;
  transform:translate(-50%,-50%) rotate(0deg);}
#leafletMap{position:absolute;inset:0;}
.leaflet-div-icon{background:transparent!important; border:none!important;}
.leaflet-control-attribution{font-size:9.5px!important;}

/* .pmarker is the element Leaflet itself positions (translate3d) — never set transform on it directly.
   .pmarker-rot is the inner element the compass-mode code rotates instead. */
.pmarker{display:flex; justify-content:center; pointer-events:none;}
.pmarker-rot{display:flex; flex-direction:column; align-items:center;}
.pmarker .dot{width:24px;height:24px;border-radius:50%; background:var(--brick); border:3px solid #fff;
  box-shadow:0 0 0 4px color-mix(in srgb, var(--brick) 35%, transparent), var(--shadow-sm);}
.pmarker .label{margin-top:4px;font-size:10px;font-weight:800;background:var(--surface);padding:2px 8px;border-radius:8px;box-shadow:var(--shadow-sm);white-space:nowrap;}

.smarker{display:flex; flex-direction:column; align-items:center; cursor:pointer; animation:bob 2.6s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
.smarker .badge{width:50px;height:50px;border-radius:50%; display:flex;align-items:center;justify-content:center; overflow:hidden;
  background:var(--surface); box-shadow:var(--shadow-lg); border:3px solid var(--mc, var(--blue-600)); position:relative;}
.smarker .badge svg{width:25px;height:25px; stroke:var(--mc, var(--blue-600));}
.smarker .badge img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
.smarker .stem{width:4px;height:11px;background:var(--mc, var(--blue-600));margin-top:-2px;border-radius:2px;}
.smarker.far{opacity:.5; filter:grayscale(.3);}
.smarker .ring-pulse{position:absolute; inset:-6px; border-radius:50%; border:2px solid var(--mc,var(--blue-600)); opacity:0; animation:pulse 2.2s ease-out infinite;}
@keyframes pulse{0%{opacity:.55;transform:scale(.8);}100%{opacity:0;transform:scale(1.5);}}
.smarker.poi .badge{background:var(--gold-100); border-color:var(--gold);}
.smarker.poi .badge svg{stroke:var(--gold-dark);}
.smarker.shiny .badge{box-shadow:0 0 0 3px var(--mc), 0 0 16px 4px color-mix(in srgb, var(--mc) 55%, transparent), var(--shadow-lg);}
.shiny-spark{position:absolute; top:-9px; right:-7px; font-size:15px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.35)); animation:spark-pulse 1.6s ease-in-out infinite;}
@keyframes spark-pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.3);}}
.capture-portrait.shiny{box-shadow:0 0 0 4px var(--rarity), 0 0 22px 6px color-mix(in srgb, var(--rarity) 55%, transparent);}

.map-toast{
  position:absolute; left:50%; top:calc(64px + env(safe-area-inset-top,0px)); transform:translateX(-50%);
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-sm);
  padding:8px 14px; border-radius:999px; font-size:12px; font-weight:700; color:var(--ink-soft);
  z-index:420; max-width:88vw; text-align:center;
}
.geo-banner{
  position:absolute; left:12px; right:12px; top:calc(64px + env(safe-area-inset-top,0px)); z-index:421;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-lg);
  border-radius:16px; padding:12px 14px; display:none; align-items:center; gap:10px;
}
.geo-banner .geo-banner-text{flex:1; font-size:12px; font-weight:700; color:var(--ink-soft); line-height:1.4;}
.geo-banner button{
  flex:none; background:var(--blue-600); color:#fff; border:none; border-radius:999px;
  padding:9px 14px; font-family:"Fredoka"; font-weight:600; font-size:12.5px; cursor:pointer;
}
.recenter-btn{
  position:absolute; right:14px; bottom:100px; z-index:400; width:44px;height:44px;border-radius:50%;
  background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow-lg);
  display:flex; align-items:center; justify-content:center;
}
.recenter-btn svg{width:20px;height:20px;stroke:var(--blue-600);}
.recenter-btn.following svg{stroke:var(--brick);}
#compassBtn{bottom:154px;}
#compassBtn.active svg{stroke:var(--brick);}

/* ---------- bottom nav ---------- */
#tabbar{
  position:relative; z-index:410;
  display:flex; justify-content:space-around; align-items:stretch;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px)) 6px;
  background:color-mix(in srgb, var(--surface) 94%, transparent);
  backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  box-shadow:0 -6px 20px rgba(18,42,79,.06);
}
.tab{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:4px;
  background:none; border:none; padding:7px 2px 6px 2px; color:var(--ink-faint); font-weight:800; font-size:10.5px;
  letter-spacing:.01em; position:relative; transition:transform .15s;
}
.tab .tab-icon-wrap{
  width:34px; height:26px; border-radius:14px; display:flex; align-items:center; justify-content:center;
  transition:background .18s;
}
.tab svg{width:21px;height:21px; stroke:var(--ink-faint); transition:stroke .15s;}
.tab.active{color:var(--blue-600);}
.tab.active .tab-icon-wrap{background:var(--blue-100);}
.tab.active svg{stroke:var(--blue-600);}
.tab:active{transform:scale(.92);}
.tab .dot-ind{display:none;}

/* ---------- generic screen scaffold ---------- */
.screen{position:absolute; inset:0; overflow-y:auto; padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(96px + env(safe-area-inset-bottom,0px)) 16px; background:var(--bg);}
.screen h1{font-size:22px; margin:4px 0 2px 0; color:var(--ink);}
.screen .sub{color:var(--ink-soft); font-size:13px; margin:0 0 16px 0; font-weight:700;}

/* ---------- dex grid ---------- */
.dex-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(96px,1fr)); gap:10px;}
.dex-card{
  background:linear-gradient(165deg, var(--surface), color-mix(in srgb, var(--rarity, var(--rarity-commun)) 8%, var(--surface)));
  border:1px solid var(--line); border-radius:var(--radius-md);
  padding:12px 6px 9px 6px; display:flex; flex-direction:column; align-items:center; gap:7px;
  box-shadow:var(--shadow-sm); cursor:pointer; transition:transform .12s, box-shadow .12s;
}
.dex-card:active{transform:scale(.96);}
.dex-card:not(.locked){box-shadow:var(--shadow-sm), inset 0 0 0 1px color-mix(in srgb, var(--rarity, var(--rarity-commun)) 18%, transparent);}
.icon-wrap{
  width:58px;height:58px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 32% 28%, color-mix(in srgb, var(--rarity, var(--rarity-commun)) 20%, var(--surface-alt)), var(--surface-alt) 70%);
  border:2.5px solid var(--rarity, var(--rarity-commun)); flex:none; position:relative;
  box-shadow:0 3px 10px color-mix(in srgb, var(--rarity, var(--rarity-commun)) 30%, transparent);
}
.dex-shiny-spark{position:absolute; top:-6px; right:-4px; font-size:13px; filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));}
.tag-shiny{display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; padding:3px 9px; border-radius:6px; background:var(--grad-gold); color:#3a2a08; box-shadow:0 2px 8px color-mix(in srgb, var(--gold) 45%, transparent);}
.icon-wrap svg{width:28px;height:28px; stroke:var(--rarity, var(--rarity-commun));}
.dex-card.locked .icon-wrap{filter:grayscale(1) brightness(.8); opacity:.5; border-color:var(--line); box-shadow:none; background:var(--surface-alt);}
.dex-card .name{font-size:11.5px; font-weight:800; text-align:center; line-height:1.15;}
.dex-card .stagepips{display:flex; gap:3px;}
.dex-card .stagepips i{width:5px;height:5px;border-radius:50%;background:var(--line);}
.dex-card .stagepips i.on{background:var(--rarity, var(--rarity-commun));}
.rarity-tag{font-size:8.5px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; padding:3px 8px; border-radius:6px;}
.rarity-tag.commun{background:linear-gradient(135deg, color-mix(in srgb, var(--rarity-commun) 22%, transparent), color-mix(in srgb, var(--rarity-commun-2) 18%, transparent)); color:var(--rarity-commun);}
.rarity-tag.peu-commun{background:linear-gradient(135deg, color-mix(in srgb, var(--rarity-peu) 20%, transparent), color-mix(in srgb, var(--rarity-peu-2) 16%, transparent)); color:var(--rarity-peu);}
.rarity-tag.rare{background:linear-gradient(135deg, color-mix(in srgb, var(--rarity-rare) 20%, transparent), color-mix(in srgb, var(--rarity-rare-2) 16%, transparent)); color:var(--rarity-rare);}
.rarity-tag.legendaire{background:var(--grad-gold); color:#3a2a08; box-shadow:0 2px 8px color-mix(in srgb, var(--gold) 40%, transparent);}

/* ---------- sheet / modal ---------- */
.sheet-backdrop{position:fixed; inset:0; background:rgba(10,18,30,.45); z-index:600; display:flex; align-items:flex-end; justify-content:center;}
.sheet{
  width:100%; max-width:480px; background:var(--surface); border-radius:26px 26px 0 0;
  box-shadow:var(--shadow-lg); max-height:88vh; overflow-y:auto;
  padding:10px 20px calc(24px + env(safe-area-inset-bottom,0px)) 20px;
  animation:sheetup .25s ease-out;
}
@keyframes sheetup{from{transform:translateY(30px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.sheet-handle{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 14px auto;}
.btn{
  border:none; border-radius:999px; font-family:"Fredoka"; font-weight:600; font-size:15px;
  padding:13px 20px; cursor:pointer; width:100%; text-align:center; transition:transform .1s, box-shadow .1s;
}
.btn:active:not(:disabled){transform:scale(.97);}
.btn-primary{background:var(--grad-primary); color:#fff; box-shadow:0 6px 16px color-mix(in srgb, var(--blue-600) 48%, transparent);}
.btn-gold{background:var(--grad-gold); color:var(--blue-800); box-shadow:0 6px 16px color-mix(in srgb, var(--gold) 48%, transparent);}
.btn-ghost{background:var(--surface-alt); color:var(--ink);}
.btn:disabled{opacity:.45; cursor:not-allowed;}
input.text-input{
  width:100%; border:2px solid var(--line); background:var(--surface-alt); border-radius:var(--radius-sm);
  padding:12px 14px; font-size:16px; color:var(--ink); font-family:inherit; font-weight:700;
}
input.text-input:focus{outline:none; border-color:var(--blue-600);}

/* ---------- capture screen ---------- */
#captureView{position:fixed; inset:0; z-index:700;
  background:radial-gradient(120% 70% at 50% 0%, color-mix(in srgb, var(--rarity, var(--blue-500)) 22%, var(--blue-100)) 0%, var(--bg) 65%);
  display:flex; flex-direction:column;}
.capture-top{display:flex; justify-content:space-between; align-items:center; padding:calc(14px + env(safe-area-inset-top,0px)) 16px 0 16px;}
.capture-close{background:var(--surface); border:1px solid var(--line); border-radius:50%; width:38px;height:38px; display:flex; align-items:center; justify-content:center; box-shadow:var(--shadow-sm);}
.capture-stage{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:10px 20px;}
.capture-rounds{display:flex; gap:6px; margin:0 0 2px 0;}
.capture-rounds i{width:11px;height:11px;border-radius:50%; background:var(--surface-alt); border:2px solid var(--line); transition:background .2s, border-color .2s, transform .2s;}
.capture-rounds i.won{background:var(--rarity, var(--blue-600)); border-color:var(--rarity, var(--blue-600)); transform:scale(1.1);}
.capture-rounds i.current{border-color:var(--rarity, var(--blue-600));}
.capture-round-label{font-size:11px; font-weight:800; color:var(--ink-faint); text-transform:uppercase; letter-spacing:.05em; margin:0;}
.capture-portrait{
  width:150px;height:150px;border-radius:50%; display:flex; align-items:center; justify-content:center;
  background:radial-gradient(circle at 32% 26%, color-mix(in srgb, var(--rarity, var(--blue-600)) 16%, var(--surface)), var(--surface) 75%);
  box-shadow:var(--shadow-lg), 0 0 0 6px color-mix(in srgb, var(--rarity, var(--blue-600)) 12%, transparent);
  border:5px solid var(--rarity, var(--blue-600));
  position:relative;
}
.capture-portrait svg{width:76px;height:76px; stroke:var(--rarity, var(--blue-600));}
.capture-portrait.shake{animation:shake .35s ease-in-out;}
@keyframes shake{0%,100%{transform:translateX(0) rotate(0);}25%{transform:translateX(-8px) rotate(-4deg);}75%{transform:translateX(8px) rotate(4deg);}}
.capture-portrait.round-won{animation:roundwon .5s ease-out;}
@keyframes roundwon{0%{transform:scale(1);}40%{transform:scale(1.08);}100%{transform:scale(1);}}
.capture-name{font-family:"Fredoka"; font-size:20px; margin:0;}
.capture-stage-name{font-size:12px; color:var(--ink-faint); font-weight:700; margin:-2px 0 0; text-transform:uppercase; letter-spacing:.03em;}
.capture-track{
  width:min(88vw,340px); height:16px; border-radius:9px; background:var(--surface-alt); border:1px solid var(--line);
  position:relative; overflow:hidden; margin-top:6px; box-shadow:inset 0 2px 4px rgba(0,0,0,.06);
}
.capture-track .zone{position:absolute; top:0; bottom:0; background:linear-gradient(180deg, color-mix(in srgb, var(--green) 55%, transparent), color-mix(in srgb, var(--green) 35%, transparent)); border-left:2px solid var(--green); border-right:2px solid var(--green);}
.capture-track .needle{position:absolute; top:-4px; bottom:-4px; width:4px; background:var(--brick); border-radius:2px; box-shadow:0 0 6px color-mix(in srgb, var(--brick) 70%, transparent);}
.capture-hint{font-size:12px; color:var(--ink-soft); font-weight:700;}
.card-throw{
  width:76px;height:76px;border-radius:50%; background:radial-gradient(circle at 35% 28%, var(--gold-light), var(--gold) 55%, var(--gold-dark));
  border:none; box-shadow:var(--shadow-lg), 0 0 0 5px color-mix(in srgb, var(--gold) 20%, transparent); margin:14px 0 4px 0; display:flex; align-items:center; justify-content:center;
  transition:transform .1s;
}
.card-throw:active{transform:scale(.93);}
.card-throw svg{width:30px;height:30px; stroke:#3a2a08;}

function icon(name, extra){ return `<svg viewBox="0 0 24 24" fill="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" ${extra||''}>${ICONS[name]||ICONS.star}</svg>`; }

function pad(n){return String(n).padStart(2,'0');}
function d(y,m,day,h,mi){return new Date(y,m-1,day,h||0,mi||0,0);}

function eventBonusMultiplier(){
  const ev = activeEvent(new Date());

/* ============================= UTILS ============================= */
function mulberry32(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function destPoint(lat,lon,dx,dy){
  const R=6371000, toRad=Math.PI/180;
  const newLat = lat + (dy/R)*(180/Math.PI);
  const newLon = lon + (dx/(R*Math.cos(lat*toRad)))*(180/Math.PI);
  return {lat:newLat, lon:newLon};
}
function fmtDist(m){ return m<1000 ? Math.round(m)+' m' : (m/1000).toFixed(1)+' km'; }
function fmtCountdown(target){
  let diff = target - Date.now();
  if(diff<=0) return null;
  const days=Math.floor(diff/86400000); diff-=days*86400000;
  const hours=Math.floor(diff/3600000); diff-=hours*3600000;
  const mins=Math.floor(diff/60000);
  if(days>0) return `${days} j ${pad(hours)} h`;
  return `${pad(hours)} h ${pad(mins)} min`;
}
function xpForLevel(lvl){ return Math.round(60*lvl*lvl); }
function levelFromXp(xp){ let lvl=1; while(xp>=xpForLevel(lvl+1) && lvl<40) lvl++; return lvl; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function isShinyActive(shiny){
  if(!shiny || !shiny.active) return false;
  if(shiny.expiresAt){ return new Date(shiny.expiresAt).getTime() > Date.now(); }
  return true;
}
// Keeps generated spawn points out of the river sector (west, ~150-210°) so they read as being on land.
function randomLandAngle(rng){
  let a;
  for(let i=0;i<6;i++){
    a = rng()*Math.PI*2;
    const deg = ((a*180/Math.PI)+360)%360;
    if(!(deg>145 && deg<215)) return a;
  }
  return a;
}

/* ============================= STATE ============================= */
const RANGE_M = 60;
const SPAWN_COUNT = 10;

let state = null;
function defaultState(){
  return {
    trainerName:null,
    xp:0,
    coins:0,
    captures:{},
    poiSpins:{},
    totalPoiSpins:0,

function loadLocal(){
  try{ const raw = localStorage.getItem('pokenevers_save_v1'); return raw? JSON.parse(raw): null; }
  catch(e){ return null; }
}
function saveLocal(){
  try{ localStorage.setItem('pokenevers_save_v1', JSON.stringify(state)); }catch(e){}
}

let map=null, tileLayer=null, rangeCircle=null, playerLeafletMarker=null;
let spawnMarkers={}, poiMarkers={};
let curLat=null, curLon=null;
let usingFallback=false, firstFixDone=false, followMode=true;
let geoWatchId=null;

/* ============================= SPAWNS ============================= */
function pickSpeciesForSpawn(rng){
  const ev = activeEvent(new Date());
  let pool = SPECIES.slice();
  const weights = pool.map(sp=>{
    let w = RARITY_CATCH[sp.rarity];
    if(ev && ev.id==='marche-automne' && (sp.id==='marche'||sp.id==='fromagerie')) w*=2.2;
    if(ev && ev.id==='inventaire-faience' && sp.id==='faiencerie') w*=6;
    return Math.max(w,0.02);
  });
  const total = weights.reduce((a,b)=>a+b,0);
  let r = rng()*total;
  for(let i=0;i<pool.length;i++){ r-=weights[i]; if(r<=0) return pool[i]; }
  return pool[0];
}
function genSpawn(rng, uid){
  const sp = pickSpeciesForSpawn(rng);
  const angle = randomLandAngle(rng);
  const dist = 40 + rng()*280;
  const pt = destPoint(ORIGIN.lat, ORIGIN.lon, Math.cos(angle)*dist, Math.sin(angle)*dist);
  return {uid, speciesId:sp.id, lat:pt.lat, lon:pt.lon};
}
function getSpeciesById(id){ return ACTIVE_MERCHANTS.find(s=>s.id===id); }
function ensureSpawns(){
  if(usingLiveMerchants){
    // Vrais commerçants : positions fixes, placées dans le panel admin — pas de tirage aléatoire.
    state.spawns = ACTIVE_MERCHANTS.map(m=>({uid:m.id, speciesId:m.id, lat:m.lat, lon:m.lon}));
    return;
  }
  if(state.spawns && state.spawns.length===SPAWN_COUNT) return;
  const rng = mulberry32(20260911);
  state.spawns = [];
  for(let i=0;i<SPAWN_COUNT;i++) state.spawns.push(genSpawn(rng, 's'+i+'_'+Date.now()));
  saveLocal();
}
function respawnOne(oldUid){
  if(usingLiveMerchants) return; // un vrai commerçant reste à sa place ; voir captureCooldowns pour la re-capture.
  const rng = mulberry32(Date.now()%100000);
  const fresh = genSpawn(rng, 's'+Date.now());
  const idx = state.spawns.findIndex(s=>s.uid===oldUid);
  if(idx>=0) state.spawns[idx]=fresh; else state.spawns.push(fresh);
  saveLocal();
}

/* ============================= MAP (Leaflet) ============================= */
function divIcon(html, size, anchor, className){
  return L.divIcon({ html, className: className||'', iconSize: size, iconAnchor: anchor });
}
function initMap(){
  map = L.map('leafletMap', { zoomControl:false, attributionControl:true }).setView([ORIGIN.lat, ORIGIN.lon], 17);
  tileLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
  }).addTo(map);

  rangeCircle = L.circle([ORIGIN.lat, ORIGIN.lon], {
    radius: RANGE_M, color: '#1a56b0', weight:2, dashArray:'5 5', fillColor:'#1a56b0', fillOpacity:.07
  }).addTo(map);

  playerLeafletMarker = L.marker([ORIGIN.lat, ORIGIN.lon], {
    icon: divIcon('<div class="pmarker-rot"><div class="dot"></div><div class="label">Vous</div></div>', [80,50], [40,13], 'pmarker'),
    zIndexOffset: 1000, interactive:false
  }).addTo(map);

  ensureSpawns();
  renderPoiMarkers();
  renderSpawnMarkers();

  map.on('dragstart', ()=>{ followMode=false; updateRecenterBtn(); });
  document.getElementById('recenterBtn').addEventListener('click', ()=>{
    followMode=true; updateRecenterBtn();
    if(curLat!==null) map.panTo([curLat,curLon], {animate:true});
  });
  document.getElementById('recenterBtn').innerHTML = icon('locate');
  updateRecenterBtn();

  document.getElementById('compassBtn').innerHTML = icon('compass');
  document.getElementById('compassBtn').addEventListener('click', ()=>{
    if(compassMode) disableCompass(); else enableCompass();
  });
}
function updateRecenterBtn(){
  document.getElementById('recenterBtn').classList.toggle('following', followMode);
}

/* ---- compass mode: rotate the map so "forward" is always up ---- */
let compassMode=false, lastAppliedHeading=null, compassListenerAttached=false;
function getCompassHeading(ev){
  if(typeof ev.webkitCompassHeading === 'number' && !isNaN(ev.webkitCompassHeading)) return ev.webkitCompassHeading; // iOS Safari: already a true compass heading
  if(ev.alpha!=null){
    const screenAngle = (screen.orientation && typeof screen.orientation.angle==='number') ? screen.orientation.angle : (window.orientation||0);
    let heading = 360 - ev.alpha + screenAngle;
    heading = ((heading % 360) + 360) % 360;
    return heading;
  }
  return null;
}
function applyMapRotation(headingDeg){
  const rotator = document.getElementById('mapRotator');
  if(rotator) rotator.style.transform = `translate(-50%,-50%) rotate(${-headingDeg}deg)`;
  const pEl = playerLeafletMarker && playerLeafletMarker.getElement();
  const pInner = pEl && pEl.querySelector('.pmarker-rot');
  if(pInner) pInner.style.transform = `rotate(${headingDeg}deg)`;
}
function onDeviceOrientation(ev){
  if(!compassMode) return;
  const heading = getCompassHeading(ev);
  if(heading==null) return;
  if(lastAppliedHeading!==null){
    let diff = Math.abs(heading-lastAppliedHeading);
    if(diff>180) diff = 360-diff;
    if(diff<1.2) return; // ignore tiny jitter
  }
  lastAppliedHeading = heading;
  requestAnimationFrame(()=> applyMapRotation(heading));
}
function disableCompass(){
  compassMode=false;
  document.getElementById('compassBtn').classList.remove('active');
  applyMapRotation(0);
}
function enableCompass(){
  if(!window.DeviceOrientationEvent){
    showToast("La boussole n'est pas prise en charge par ce navigateur.");
    return;
  }
  const start = ()=>{
    compassMode=true;
    document.getElementById('compassBtn').classList.add('active');
    if(!compassListenerAttached){
      const evName = ('ondeviceorientationabsolute' in window) ? 'deviceorientationabsolute' : 'deviceorientation';
      window.addEventListener(evName, onDeviceOrientation);
      compassListenerAttached = true;
    }
    showToast('Boussole activée : la carte tourne pour que "devant vous" reste en haut.');
  };
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    // iOS 13+ : doit être appelé depuis un geste utilisateur (le tap sur le bouton)
    DeviceOrientationEvent.requestPermission().then(res=>{
      if(res==='granted') start();
      else showToast("Accès refusé au capteur d'orientation. Sur iPhone : Réglages > Safari > Mouvement et orientation, puis rechargez la page.");
    }).catch(()=> showToast("Impossible d'accéder au capteur d'orientation sur cet appareil."));
  } else {
    start();
  }
}
function renderPoiMarkers(){
  Object.values(poiMarkers).forEach(m=> map.removeLayer(m));
  poiMarkers = {};
  ACTIVE_POIS.forEach((p,i)=>{
    const el = L.marker([p.lat,p.lon], {
      icon: divIcon(`<div class="smarker poi"><div class="badge">${icon(p.icon)}</div><div class="stem" style="background:var(--gold);"></div></div>`, [50,66], [25,66])
    }).addTo(map);
    el.on('click', ()=> onPoiTap(p, i));
    poiMarkers[i]=el;
  });
}
function renderSpawnMarkers(){
  Object.values(spawnMarkers).forEach(m=> map.removeLayer(m));
  spawnMarkers = {};
  state.spawns.forEach(sp=>{
    const species = getSpeciesById(sp.speciesId);
    if(!species) return;
    const shinyOn = isShinyActive(species.shiny);
    const mc = shinyOn ? (species.shiny.color||'#d9a441') : `var(--rarity-${species.rarity})`;
    const badgeContent = species.image ? `<img src="${species.image}" alt="">` : icon(species.icon);
    const el = L.marker([sp.lat,sp.lon], {
      icon: divIcon(`<div class="smarker ${shinyOn?'shiny':''}" style="--mc:${mc};"><div class="badge">${shinyOn?'<div class="shiny-spark">✨</div>':''}<div class="ring-pulse"></div>${badgeContent}</div><div class="stem"></div></div>`, [50,66], [25,66])
    }).addTo(map);
    el.on('click', ()=> onSpawnTap(sp));
    spawnMarkers[sp.uid]=el;
  });
}
function onSpawnTap(sp){
  if(curLat===null){ showToast('En attente de votre position GPS...'); return; }
  const dist = map.distance([curLat,curLon],[sp.lat,sp.lon]);
  if(dist>RANGE_M){ showToast(`Trop loin (${fmtDist(dist)}) — rapprochez-vous à moins de ${RANGE_M} m.`); return; }
  if(usingLiveMerchants){
    const last = state.captureCooldowns[sp.speciesId]||0;
    const cooldownMs = 10*60*1000;
    const remain = cooldownMs-(Date.now()-last);
    if(remain>0){ showToast(`Revenez dans ${Math.ceil(remain/60000)} min pour retenter votre chance ici.`); return; }
  }
  openCapture(sp);
}
function onPoiTap(p,i){
  if(curLat===null){ showToast('En attente de votre position GPS...'); return; }
  const dist = map.distance([curLat,curLon],[p.lat,p.lon]);
  if(dist>RANGE_M){ showToast(`Trop loin (${fmtDist(dist)}) — rapprochez-vous à moins de ${RANGE_M} m.`); return; }
  spinPoi(p,i);
}
let toastTimer=null;
function showToast(msg){
  let t = document.querySelector('.map-toast');
  if(!t){ t=document.createElement('div'); t.className='map-toast'; document.getElementById('mapView').appendChild(t); }
  t.textContent = msg; t.style.display='block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.style.display='none'; }, 3200);
}
function spinPoi(p,i){
  const key = 'p'+i;
  const last = state.poiSpins[key]||0;
  const cooldownMs = 5*60*1000;
  if(Date.now()-last < cooldownMs){
    showToast(`${p.name} : revenez dans ${Math.ceil((cooldownMs-(Date.now()-last))/60000)} min.`);
    return;
  }
  state.poiSpins[key]=Date.now();
  state.totalPoiSpins = (state.totalPoiSpins||0)+1;
  const cMin = p.rewardCoinsMin!=null?p.rewardCoinsMin:2, cMax = p.rewardCoinsMax!=null?p.rewardCoinsMax:4;
  const mult = eventBonusMultiplier();
  const gained = Math.round((cMin+Math.floor(Math.random()*(cMax-cMin+1)))*mult);
  const xpGain = Math.round((p.rewardXp!=null?p.rewardXp:15)*mult);
  state.coins += gained;
  state.xp += xpGain;
  saveLocal();
  renderStatusBar();
  showToast(`${p.name} : +${gained} tampons, +${xpGain} XP !`);
  checkMissions();
}

/* ============================= GEO ============================= */
const GEO_MESSAGES = {
  unsupported: "La géolocalisation n'est pas prise en charge par ce navigateur — position simulée au centre de Nevers.",
  denied: "Localisation refusée. Autorisez la position pour ce site dans les réglages de votre navigateur, puis appuyez sur Réessayer.",
  timeout: "Le GPS met trop de temps à répondre (courant en intérieur). Sortez si possible et appuyez sur Réessayer.",
  unavailable: "Position momentanément indisponible. Appuyez sur Réessayer.",
};
function startGeo(){
  hideGeoBanner();
  if(!('geolocation' in navigator)){ fallbackGeo('unsupported'); return; }
  navigator.geolocation.getCurrentPosition(
    pos=>{ usingFallback=false; onGeo(pos.coords.latitude,pos.coords.longitude); hideGeoBanner(); startWatch(); },
    err=>{ const code=err&&err.code; fallbackGeo(code===1?'denied':(code===3?'timeout':'unavailable')); },
    {enableHighAccuracy:true, timeout:10000}
  );
}
function startWatch(){
  if(geoWatchId!==null) return;
  geoWatchId = navigator.geolocation.watchPosition(
    pos=>{ usingFallback=false; onGeo(pos.coords.latitude,pos.coords.longitude); hideGeoBanner(); },
    ()=>{},
    {enableHighAccuracy:true, maximumAge:2000, timeout:12000}
  );
}
function fallbackGeo(reason){
  usingFallback=true;
  if(curLat===null) onGeo(ORIGIN.lat, ORIGIN.lon);
  showGeoBanner(GEO_MESSAGES[reason] || GEO_MESSAGES.unavailable);
}
function showGeoBanner(msg){
  const b=document.getElementById('geoBanner'); if(!b) return;
  b.querySelector('.geo-banner-text').textContent=msg; b.style.display='flex';
}
function hideGeoBanner(){ const b=document.getElementById('geoBanner'); if(b) b.style.display='none'; }
function onGeo(lat,lon){
  curLat=lat; curLon=lon;
  if(!firstFixDone){
    firstFixDone=true;
    if(!usingFallback) setTimeout(()=> showToast('GPS réel activé · vraie carte OpenStreetMap.'), 400);
  }
  if(playerLeafletMarker) playerLeafletMarker.setLatLng([lat,lon]);
  if(rangeCircle) rangeCircle.setLatLng([lat,lon]);
  if(followMode && map) map.panTo([lat,lon], {animate:true, duration:0.4});
}

/* ============================= CAPTURE ============================= */
let capture=null;
function openCapture(sp){
  const species = getSpeciesById(sp.speciesId);
  const stageIdx = (state.captures[sp.speciesId]?.stage)||0;
  const stage = species.stages[Math.min(stageIdx, species.stages.length-1)];
  const zoneW = RARITY_ZONE[species.rarity];
  const shinyOn = isShinyActive(species.shiny);
  const roundsTotal = RARITY_ROUNDS[species.rarity];
  capture = { spawnUid:sp.uid, species, stage, running:true, pos:0, dir:1, speed:0.028, resolved:false,
    roundsTotal, roundsWon:0,
    zoneStart: Math.max(0.06, Math.min(1-zoneW-0.06, Math.random()*(1-zoneW))) };
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div id="captureView">
      <div class="capture-top"><button class="capture-close" id="captureCloseBtn">${icon('close','style="width:16px;height:16px;stroke:var(--ink-soft)"')}</button><div></div></div>
      <div class="capture-stage" style="--rarity:${shinyOn?(species.shiny.color||'#d9a441'):`var(--rarity-${species.rarity})`};">
        <span class="rarity-tag ${species.rarity}">${RARITY_LABEL[species.rarity]}</span>
        ${shinyOn?`<span class="tag-shiny">✨ ${escapeHtml(species.shiny.label||'Shiny')}</span>`:''}
        <div class="capture-portrait ${shinyOn?'shiny':''}" id="capturePortrait" style="--rarity:${shinyOn?(species.shiny.color||'#d9a441'):`var(--rarity-${species.rarity})`};">${icon(species.icon)}</div>
        <h2 class="capture-name">${escapeHtml(species.name||stage.name)}</h2>
        ${(species.name && species.name!==stage.name)?`<p class="capture-stage-name">${escapeHtml(stage.name)}</p>`:''}
        ${roundsTotal>1?`<p class="capture-round-label" id="captureRoundLabel"></p><div class="capture-rounds" id="captureRounds"></div>`:''}
        <p class="capture-hint">Appuyez sur la carte quand l'aiguille est dans la zone verte.</p>
        <div class="capture-track" id="captureTrack">
          <div class="zone" id="captureZone" style="left:${capture.zoneStart*100}%; width:${zoneW*100}%;"></div>
          <div class="needle" id="captureNeedle"></div>
        </div>
        <button class="card-throw" id="throwBtn">${icon('compass')}</button>
        <div id="captureResultWrap"></div>
      </div>
    </div>`;
  document.getElementById('captureCloseBtn').onclick = closeCapture;
  document.getElementById('throwBtn').onclick = doThrow;
  updateCaptureRounds();
  requestAnimationFrame(captureLoop);
}
function updateCaptureRounds(){
  if(!capture || capture.roundsTotal<=1) return;
  const label = document.getElementById('captureRoundLabel');
  const pips = document.getElementById('captureRounds');
  if(label) label.textContent = `Manche ${Math.min(capture.roundsWon+1, capture.roundsTotal)}/${capture.roundsTotal}`;
  if(pips) pips.innerHTML = Array.from({length:capture.roundsTotal}).map((_,i)=>
    `<i class="${i<capture.roundsWon?'won':''} ${i===capture.roundsWon?'current':''}"></i>`).join('');
}
function captureLoop(){
  if(!capture || !capture.running) return;
  capture.pos += capture.dir*capture.speed;
  if(capture.pos>=1){ capture.pos=1; capture.dir=-1; }
  if(capture.pos<=0){ capture.pos=0; capture.dir=1; }
  const needle = document.getElementById('captureNeedle');
  if(needle) needle.style.left = (capture.pos*100)+'%';
  requestAnimationFrame(captureLoop);
}
function doThrow(){
  if(!capture || capture.resolved) return;
  capture.running=false; capture.resolved=true;
  const zoneW = RARITY_ZONE[capture.species.rarity];
  const inZone = capture.pos>=capture.zoneStart && capture.pos<=capture.zoneStart+zoneW;
  // Toucher la zone verte = capture de la manche, point final (comme l'indique le texte à l'écran) :
  // la difficulté vient de la largeur de zone (par rareté), du nombre de manches à enchaîner et
  // de la vitesse croissante de l'aiguille — pas d'un tirage au sort caché après un tir pourtant réussi.
  const success = inZone ? true : (Math.random() < 0.06);
  const portrait = document.getElementById('capturePortrait');
  document.getElementById('throwBtn').style.visibility='hidden';
  portrait.classList.add('shake');
  setTimeout(()=>{
    const wrap = document.getElementById('captureResultWrap');
    if(success){
      capture.roundsWon++;
      if(capture.roundsWon < capture.roundsTotal){
        portrait.classList.remove('shake');
        portrait.classList.add('round-won');
        setTimeout(()=> portrait && portrait.classList.remove('round-won'), 500);
        updateCaptureRounds();
        const left = capture.roundsTotal-capture.roundsWon;
        wrap.innerHTML = `<div class="capture-result partial" style="--rarity:var(--rarity-${capture.species.rarity});">Manche réussie !</div><p class="capture-hint">Encore ${left} manche${left>1?'s':''} pour le capturer.</p>`;
        capture.zoneStart = Math.max(0.06, Math.min(1-zoneW-0.06, Math.random()*(1-zoneW)));
        const zoneEl = document.getElementById('captureZone');
        if(zoneEl) zoneEl.style.left = (capture.zoneStart*100)+'%';
        capture.speed = Math.min(capture.speed+0.006, 0.05);
        capture.pos=0; capture.dir=1; capture.resolved=false; capture.running=true;
        document.getElementById('throwBtn').style.visibility='visible';
        setTimeout(()=>{ if(capture) wrap.innerHTML=''; }, 900);
        requestAnimationFrame(captureLoop);
      } else {
        applyCapture(capture.species, capture.spawnUid);
        wrap.innerHTML = `<div class="capture-result success">Capturé !</div><p class="capture-hint">+${RARITY_XP[capture.species.rarity]} XP · +${RARITY_CANDY[capture.species.rarity]} tampons</p><button class="btn btn-primary" id="captureDoneBtn" style="margin-top:10px;">Continuer</button>`;
        document.getElementById('captureDoneBtn').onclick = closeCapture;
      }
    } else {
      wrap.innerHTML = `<div class="capture-result fail">Il s'est échappé…</div><p class="capture-hint">Retentez votre chance sur un prochain passage.</p><button class="btn btn-ghost" id="captureDoneBtn" style="margin-top:10px;">Fermer</button>`;
      document.getElementById('captureDoneBtn').onclick = closeCapture;
    }
  }, 380);
}
function applyCapture(species, spawnUid){
  const mult = eventBonusMultiplier();
  const entry = state.captures[species.id] || {stage:0, candy:0};
  entry.candy += RARITY_CANDY[species.rarity]*mult;
  entry.caughtAt = new Date().toISOString();
  state.captures[species.id] = entry;
  state.xp += RARITY_XP[species.rarity]*mult;
  state.coins += Math.round(RARITY_CANDY[species.rarity]/2)*mult;
  if(usingLiveMerchants) state.captureCooldowns[species.id] = Date.now();
  saveLocal();
  renderStatusBar();
  respawnOne(spawnUid);
  renderSpawnMarkers();
  checkMissions();
}
function closeCapture(){ capture=null; document.getElementById('modalRoot').innerHTML=''; }

}

function renderDex(){

    const entry = state.captures[sp.id];
    const caught = !!entry;
    const stageIdx = caught? Math.min(entry.stage, sp.stages.length-1) : 0;
    const stage = sp.stages[stageIdx];
    const pips = sp.stages.map((_,i)=>`<i class="${i<=stageIdx && caught?'on':''}"></i>`).join('');
    const shinyOn = caught && isShinyActive(sp.shiny);
    return `<div class="dex-card ${caught?'':'locked'}" data-sp="${sp.id}">
      <div class="icon-wrap" style="--rarity:${shinyOn?(sp.shiny.color||'#d9a441'):`var(--rarity-${sp.rarity})`};">${shinyOn?'<span class="dex-shiny-spark">✨</span>':''}${icon(sp.icon)}</div>
      <div class="name">${caught? escapeHtml(stage.name) : '???'}</div>
      <div class="stagepips">${pips}</div>
    </div>`;
  }).join('');
  el.innerHTML = `<h1>Commerçants</h1><p class="sub">${caughtCount} / ${ACTIVE_MERCHANTS.length} découverts</p><div class="dex-grid">${cards}</div>`;
  el.querySelectorAll('.dex-card').forEach(c=> c.addEventListener('click', ()=> openDexDetail(c.dataset.sp)));
}
function openDexDetail(spId){
  const sp = getSpeciesById(spId);
  const entry = state.captures[spId];
  const caught = !!entry;
  const stageIdx = caught? Math.min(entry.stage, sp.stages.length-1): 0;
  const stage = sp.stages[stageIdx];
  const canEvolve = caught && stage.need!=null && entry.candy>=stage.need;
  const nextStage = caught && stage.need!=null ? sp.stages[stageIdx+1] : null;
  const shinyOn = caught && isShinyActive(sp.shiny);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div class="sheet-backdrop" id="sheetBackdrop"><div class="sheet">
    <div class="sheet-handle"></div>
    <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;">
      <span class="rarity-tag ${sp.rarity}">${RARITY_LABEL[sp.rarity]}</span>
      ${shinyOn?`<span class="tag-shiny">✨ ${escapeHtml(sp.shiny.label||'Shiny')}</span>`:''}
      <div class="icon-wrap" style="--rarity:${shinyOn?(sp.shiny.color||'#d9a441'):`var(--rarity-${sp.rarity})`}; width:80px;height:80px;${caught?'':'filter:grayscale(1) opacity(.5);'}">${icon(sp.icon,'style="width:38px;height:38px;"')}</div>
      <h2 class="capture-name">${caught? escapeHtml(stage.name) : '???'}</h2>
      <p class="capture-hint" style="max-width:320px;">${caught? escapeHtml(stage.desc) : "Pas encore rencontré. Explorez la carte pour le trouver."}</p>
      ${caught? `<p class="capture-hint">Tampons : <strong style="color:var(--ink);">${entry.candy}</strong>${stage.need!=null?` / ${stage.need} pour évoluer`:''}</p>`:''}
      ${nextStage? `<button class="btn ${canEvolve?'btn-gold':'btn-ghost'}" id="evolveBtn" ${canEvolve?'':'disabled'} style="margin-top:8px;">Faire évoluer${canEvolve?` → ${escapeHtml(nextStage.name)}`:''}</button>`:''}
      <button class="btn btn-ghost" id="closeSheetBtn" style="margin-top:8px;">Fermer</button>
    </div>
  </div></div>`;
  document.getElementById('sheetBackdrop').addEventListener('click', e=>{ if(e.target.id==='sheetBackdrop') closeSheet(); });

    entry.candy -= stage.need;

/* ============================= DONNÉES DU PANEL ADMIN (gamedata.json) ============================= */
// Si gamedata.json existe et contient des commerçants placés, le jeu bascule sur les vraies données ;
// sinon il continue de fonctionner avec les commerçants fictifs de démonstration ci-dessus.
let gameData = null;
let usingLiveMerchants = false;
let ACTIVE_MERCHANTS = SPECIES;
let ACTIVE_POIS = POI_DEFS;
let ACTIVE_EVENTS = EVENTS;
let ACTIVE_MISSIONS = [];
let ACTIVE_BADGES = BADGES;

async function loadGameData(){
  try{
    const res = await fetch('./gamedata.json', {cache:'no-store'});
    if(!res.ok) return;
    const json = await res.json();
    if(json && typeof json==='object') gameData = json;
  }catch(e){ /* pas de fichier ou hors-ligne : on reste sur les données de démonstration */ }
}
function applyGameData(){
  if(!gameData) return;
  const liveMerchants = (gameData.merchants||[]).filter(m=> m.active!==false && m.lat!=null && m.lon!=null);
  if(liveMerchants.length){
    usingLiveMerchants = true;
    ACTIVE_MERCHANTS = liveMerchants.map(m=>({
      id:m.id, icon:m.icon||'basket', rarity:m.rarity||'commun', name:m.name||'Commerçant',
      category:m.category||'', description:m.description||'', image:m.image||null,
      lat:m.lat, lon:m.lon, shiny:m.shiny||null,
      stages:(m.stages&&m.stages.length)? m.stages.map(s=>({name:s.name||m.name||'Stade', desc:s.desc||'', need:s.need!=null?s.need:null}))
                                         : [{name:m.name||'Commerçant', desc:m.description||'', need:null}]
    }));
  }
  const livePois = (gameData.pois||[]).filter(p=> p.active!==false && p.lat!=null && p.lon!=null);
  if(livePois.length){
    ACTIVE_POIS = livePois.map(p=>({
      name:p.name||"Point d'intérêt", icon:p.icon||'stall', lat:p.lat, lon:p.lon,
      rewardCoinsMin: p.rewardCoinsMin!=null?p.rewardCoinsMin:2,
      rewardCoinsMax: p.rewardCoinsMax!=null?p.rewardCoinsMax:4,
      rewardXp: p.rewardXp!=null?p.rewardXp:15
    }));
  }
  const liveEvents = (gameData.events||[]).filter(ev=> ev.active!==false && ev.start && ev.end);
  if(liveEvents.length){
    ACTIVE_EVENTS = liveEvents.map(ev=>({
      id:ev.id, name:ev.name||'Évènement', icon:ev.icon||'star',
      start:new Date(ev.start), end:new Date(ev.end),
      desc:ev.description||'', bonus:ev.bonusLabel||'', bonusType:ev.bonusType||'none', bonusSpeciesId:ev.bonusSpeciesId||''
    }));
  }
  ACTIVE_MISSIONS = (gameData.missions||[]).filter(mi=> mi.active!==false);
  const liveBadges = (gameData.badges||[]).filter(b=> b.active!==false);
  if(liveBadges.length){
    ACTIVE_BADGES = liveBadges.map(b=>({
      id:b.id, icon:b.icon||'medal', label:b.label||'Badge',
      test:(s)=>{
        if(b.criteriaType==='captures_count') return Object.keys(s.captures).length >= (b.criteriaValue||1);
        if(b.criteriaType==='species_captured') return !!s.captures[b.criteriaValue];
        if(b.criteriaType==='all_captured') return ACTIVE_MERCHANTS.length>0 && Object.keys(s.captures).length >= ACTIVE_MERCHANTS.length;
        if(b.criteriaType==='mission_completed') return !!(s.missionsCompleted && s.missionsCompleted[b.criteriaValue]);
        return false;
      }
    }));
  }
}

/* ============================= MISSIONS ============================= */
function missionProgress(mi){
  if(mi.type==='capture_count') return Object.keys(state.captures).length;
  if(mi.type==='poi_spin_count') return state.totalPoiSpins||0;
  if(mi.type==='catch_species') return state.captures[mi.targetSpeciesId] ? 1 : 0;
  if(mi.type==='catch_rarity') return Object.keys(state.captures).some(id=>{ const sp=getSpeciesById(id); return sp && sp.rarity===mi.targetRarity; }) ? 1 : 0;
  return 0;
}
function missionTarget(mi){
  if(mi.type==='capture_count' || mi.type==='poi_spin_count') return mi.target||1;
  return 1;
}
function checkMissions(){
  if(!ACTIVE_MISSIONS.length) return;
  let changed = false;
  ACTIVE_MISSIONS.forEach(mi=>{
    if(state.missionsCompleted[mi.id]) return;
    if(missionProgress(mi) >= missionTarget(mi)){
      state.missionsCompleted[mi.id] = true;
      state.xp += mi.rewardXp||0;
      state.coins += mi.rewardCoins||0;
      changed = true;
      showToast(`Mission accomplie : ${mi.title}${mi.rewardXp?` (+${mi.rewardXp} XP)`:''}`);
    }
  });
  if(changed){ saveLocal(); renderStatusBar(); }
}
function renderMissions(){
  const el = document.getElementById('missionsScreen');
  if(!ACTIVE_MISSIONS.length){
    el.innerHTML = `<h1>Missions</h1><p class="sub">Objectifs à accomplir en ville</p><div class="info-note">Aucune mission n'est configurée pour le moment.</div>`;
    return;
  }
  const cards = ACTIVE_MISSIONS.map(mi=>{
    const done = !!state.missionsCompleted[mi.id];
    const progress = Math.min(missionProgress(mi), missionTarget(mi));
    const target = missionTarget(mi);
    const pct = Math.max(0, Math.min(100, Math.round(progress/target*100)));
    const badge = mi.rewardBadgeId ? ACTIVE_BADGES.find(b=>b.id===mi.rewardBadgeId) : null;
    return `<div class="event-card ${done?'live':''}">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
        <div style="display:flex;gap:10px;align-items:center;">
          <div class="icon-wrap" style="width:44px;height:44px;--rarity:var(--blue-600);">${icon('flag','style="width:20px;height:20px;"')}</div>
          <strong style="font-family:'Fredoka';font-size:15px;">${escapeHtml(mi.title)}</strong>
        </div>
        <span class="event-tag ${done?'live':''}">${done?'Terminée':'En cours'}</span>
      </div>
      <p style="font-size:13px;color:var(--ink-soft);margin:10px 0 6px 0;">${escapeHtml(mi.description||'')}</p>
      <div class="mission-progress"><i style="width:${pct}%;background:${done?'var(--green)':'var(--blue-600)'};"></i></div>
      <p style="font-size:11px;color:var(--ink-faint);font-weight:700;margin:6px 0 0 0;">${progress} / ${target}${badge?' · Badge : '+escapeHtml(badge.label):''}</p>
      <p style="font-size:12px;font-weight:800;color:var(--gold-dark);margin:6px 0 0 0;">+${mi.rewardXp||0} XP · +${mi.rewardCoins||0} tampons</p>
    </div>`;
  }).join('');
  el.innerHTML = `<h1>Missions</h1><p class="sub">Objectifs à accomplir en ville</p>${cards}`;
}

function renderProfile(){
  const el = document.getElementById('profileScreen');
  const lvl = levelFromXp(state.xp);
  const totalCaught = Object.keys(state.captures).length;
  const totalEvolved = Object.values(state.captures).filter(c=>c.stage>0).length;
  const badgeHtml = ACTIVE_BADGES.map(b=>{
    const earned = b.test(state);
    return `<div class="badge-item ${earned?'earned':''}"><div class="badge-circle-lg">${icon(b.icon,'style="'+ (earned?'':'stroke:var(--ink-faint)')+'"')}</div><span>${escapeHtml(b.label)}</span></div>`;
  }).join('');
  el.innerHTML = `<h1>${escapeHtml(state.trainerName||'Dresseur')}</h1><p class="sub">Niveau ${lvl} · Nevers</p>
    <div style="background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:4px 16px;box-shadow:var(--shadow-sm);">
      <div class="profile-stat"><span>Commerçants découverts</span><strong>${totalCaught} / ${ACTIVE_MERCHANTS.length}</strong></div>
      <div class="profile-stat"><span>Évolutions réalisées</span><strong>${totalEvolved}</strong></div>
      <div class="profile-stat"><span>XP total</span><strong>${state.xp}</strong></div>
      <div class="profile-stat"><span>Tampons en poche</span><strong>${state.coins}</strong></div>
    </div>
    <h2 style="font-size:16px;margin:22px 0 0 0;">Badges</h2>
    <div class="badge-grid">${badgeHtml}</div>
    <div class="info-note">${usingLiveMerchants ? "Vrais commerçants de Nevers, vraie carte OpenStreetMap et vrai GPS. Progression enregistrée sur cet appareil uniquement pour l'instant." : "Version prototype : commerçants fictifs, mais vraie carte OpenStreetMap et vrai GPS. Progression enregistrée sur cet appareil uniquement pour l'instant. Un panel d'administration permet d'ajouter les vrais commerçants, POI et évènements."}</div>
    <button class="btn btn-ghost" id="resetBtn" style="margin-top:16px;">Réinitialiser ma progression</button>`;
  document.getElementById('resetBtn').onclick = ()=>{
    if(confirm('Réinitialiser toute la progression ?')){
      const name = state.trainerName;
      const spawns = state.spawns;
      state = defaultState(); state.trainerName=name; state.seenIntro=true; state.spawns=spawns;
      saveLocal(); renderAll();
    }
  };
}

/* ============================= NAV ============================= */
const TABS = [
  {id:'map', label:'Carte', icon:'map'},
  {id:'dex', label:'Commerçants', icon:'basket'},
  {id:'events', label:'Évènements', icon:'star'},
  {id:'missions', label:'Missions', icon:'flag'},
  {id:'profile', label:'Profil', icon:'person'},
];
let activeView='map';
function renderTabbar(){
  const bar = document.getElementById('tabbar');
  bar.innerHTML = TABS.map(t=>`<button class="tab ${activeView===t.id?'active':''}" data-tab="${t.id}">
    <span class="tab-icon-wrap">${icon(t.icon)}</span><span>${t.label}</span><span class="dot-ind"></span></button>`).join('');
  bar.querySelectorAll('.tab').forEach(b=> b.addEventListener('click', ()=> switchView(b.dataset.tab)));
}
function switchView(v){
  activeView=v;
  document.getElementById('mapView').style.display = v==='map'?'block':'none';
  document.getElementById('dexScreen').style.display = v==='dex'?'block':'none';
  document.getElementById('eventsScreen').style.display = v==='events'?'block':'none';
  document.getElementById('missionsScreen').style.display = v==='missions'?'block':'none';
  document.getElementById('profileScreen').style.display = v==='profile'?'block':'none';
  if(v==='dex') renderDex();
  if(v==='events') renderEvents();
  if(v==='missions') renderMissions();
  if(v==='profile') renderProfile();
  renderTabbar();
  if(v==='map' && map) setTimeout(()=> map.invalidateSize(), 60);
}
function renderAll(){
  renderStatusBar();
  renderTabbar();
  switchView(activeView);
}

/* ============================= ONBOARDING ============================= */
function showOnboarding(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `<div id="onboardBackdrop"><div class="onboard-card">
    <p class="onboard-logo">Poke<span class="accent">Nevers</span></p>
    <p class="onboard-tag">Capturez les commerçants de votre ville</p>
    <p style="font-size:13px;color:var(--ink-soft);font-weight:700;margin:0 0 16px 0;">Choisissez votre nom de dresseur. La page va ensuite vous demander l'accès à votre position — acceptez pour jouer avec le vrai GPS.</p>
    <input class="text-input" id="nameInput" placeholder="Votre prénom" maxlength="18" autofocus>
    <button class="btn btn-primary" id="startBtn" style="margin-top:14px;">Commencer l'aventure</button>
  </div></div>`;
  const input = document.getElementById('nameInput');
  const go = ()=>{
    const val = input.value.trim();
    state.trainerName = val || 'Dresseur';
    state.seenIntro = true;
    saveLocal();
    document.getElementById('modalRoot').innerHTML='';
    startGeo();
  };
  document.getElementById('startBtn').onclick = go;
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') go(); });
}

/* ============================= BOOT ============================= */
async function boot(){
  const saved = loadLocal();
  state = Object.assign(defaultState(), saved||{});
  // Complète les sauvegardes existantes créées avant l'ajout des missions/cooldowns.
  state.captures = state.captures || {};
  state.poiSpins = state.poiSpins || {};
  state.totalPoiSpins = state.totalPoiSpins || 0;
  state.captureCooldowns = state.captureCooldowns || {};
  state.missionsCompleted = state.missionsCompleted || {};
  await loadGameData();
  applyGameData();
  initMap();
  renderAll();
  document.getElementById('geoRetryBtn').onclick = startGeo;
  if(state.seenIntro){ startGeo(); }
  else { showOnboarding(); }
  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
document.addEventListener('DOMContentLoaded', boot);

})();
</script>
